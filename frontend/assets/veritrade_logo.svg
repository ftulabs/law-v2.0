  <!-- wordmark -->
  <text x="138" y="98" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-weight="800" font-size="92" letter-spacing="-3">
    <tspan fill="url(#vt-veri)">eri</tspan><tspan fill="#5bc6ff">Trade</tspan>
  </text>
  <!-- circuit-arrow motif -->
  <g fill="#3aa0ff">
    <rect x="566" y="58" width="34" height="7" rx="3"/>
    <rect x="566" y="72" width="24" height="7" rx="3"/>
    <circle cx="610" cy="48" r="3.5"/><circle cx="610" cy="61.5" r="3.5"/>
    <circle cx="610" cy="75" r="3.5"/><circle cx="598" cy="89" r="3.5"/>
  </g>
</svg>
