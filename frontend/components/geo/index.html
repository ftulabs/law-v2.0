<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  #wrap{border:1px solid var(--rule);border-radius:14px;background:var(--panel);overflow:hidden;box-shadow:var(--shadow)}
  #stage{position:relative;height:300px;background:radial-gradient(120% 90% at 50% -10%,
        color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%)}
  canvas{display:block;width:100%;height:100%;cursor:grab;outline:none}
  canvas:active{cursor:grabbing}
  /* Both layers stay mounted and crossfade; toggling display would snap and would also
     tear down the WebGL context every time you switched. */
  #globe,#flat{position:absolute;inset:0;transition:opacity .45s ease, transform .45s ease}
  #globe{opacity:1}
  #globe.hide{opacity:0;transform:scale(1.08);pointer-events:none}
  #flat{opacity:0;transform:scale(.96);pointer-events:none}
  #flat.show{opacity:1;transform:none;pointer-events:auto}
  #lmap{position:absolute;inset:0;background:var(--paper-2)}
  .leaflet-container{background:var(--paper-2);font-family:inherit}
  .leaflet-control-zoom a{background:var(--panel) !important;color:var(--ink) !important;
    border-color:var(--rule) !important}
  .leaflet-control-zoom a:hover{color:var(--accent) !important}
  .leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 82%,transparent) !important;
    color:var(--ink-faint) !important;font-size:9.5px !important}
  .leaflet-control-attribution a{color:var(--ink-soft) !important}
  .geo-tip{background:var(--panel) !important;color:var(--ink) !important;
    border:1px solid var(--rule) !important;border-radius:6px !important;
    box-shadow:var(--shadow) !important;font-size:11.5px !important;font-weight:600;
    padding:2px 7px !important}
  .geo-tip::before{display:none !important}
  .pin{position:absolute;transform:translate(-50%,-50%);cursor:pointer;border:0;background:none;padding:0}
  .pin .dot{display:block;width:14px;height:14px;border-radius:50%;background:var(--accent);
        box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 32%,transparent);transition:transform .15s}
  .pin:hover .dot{transform:scale(1.35)}
  .pin.on .dot{background:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 38%,transparent)}
  .pin.soon{cursor:default}
  .pin.soon .dot{width:9px;height:9px;background:var(--ink-faint);box-shadow:none;opacity:.65}
  .pin .lb{position:absolute;left:50%;top:15px;transform:translateX(-50%);white-space:nowrap;
        font-size:10.5px;font-weight:600;color:var(--ink);background:var(--panel);
        border:1px solid var(--rule);border-radius:5px;padding:1px 5px;pointer-events:none}
  .pin.soon .lb{color:var(--ink-faint);font-weight:500}
  .pin:focus-visible{outline:3px solid var(--ring);outline-offset:3px;border-radius:50%}
  #bar{display:flex;align-items:center;gap:.45rem;padding:.5rem .6rem;border-top:1px solid var(--rule);
       background:var(--panel-2);flex-wrap:wrap}
  .seg{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--panel)}
  .seg button{border:0;background:transparent;font:inherit;font-size:11.5px;font-weight:600;
        color:var(--ink-soft);padding:.3rem .65rem;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
  .seg button:focus-visible{outline:3px solid var(--ring);outline-offset:-3px}
  .seg button:disabled{opacity:.45;cursor:not-allowed}
  #names{margin-left:auto;display:flex;gap:.3rem;flex-wrap:wrap}
  .name{border:1px solid var(--rule);background:var(--panel);border-radius:99px;font:inherit;
        font-size:11.5px;font-weight:600;color:var(--ink-soft);padding:.26rem .75rem;cursor:pointer}
  .name:hover{border-color:var(--accent);color:var(--accent)}
  .name[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .name:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
  #hint{font-size:11px;color:var(--ink-faint)}
  @media (prefers-reduced-motion: reduce){.pin .dot{transition:none}}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="globe"></div>
    <div id="flat"><div id="lmap"></div></div>
  </div>
  <div id="bar">
    <div class="seg" role="group" aria-label="View">
      <button id="bGlobe" type="button" aria-pressed="true" title="3D globe - drag to spin">Globe</button>
      <button id="bMap" type="button" aria-pressed="false" title="Flat map">Map</button>
    </div>
    <span id="hint">Drag to spin &middot; click the globe for the map</span>
    <div id="names" role="group" aria-label="Choose a country by name"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/topojson-client@3"></script>
<script type="importmap">
{"imports":{"three":"https://esm.sh/three@0.160.0","three/addons/":"https://esm.sh/three@0.160.0/examples/jsm/"}}
</script>

<script>
/* Streamlit component protocol, implemented by hand so the component needs no build step.
   componentReady -> Streamlit sends streamlit:render with our args; setComponentValue
   sends the chosen ISO back to Python. */
var P = window.parent;
function send(type, data){
  var m = {isStreamlitMessage:true, type:type};
  for (var k in (data||{})) m[k] = data[k];
  P.postMessage(m, "*");
}
function setValue(v){ send("streamlit:setComponentValue", {value:v, dataType:"json"}); }
/* Measure the wrapper, not document.body.scrollHeight: on first paint the body can
   still report 0 (Leaflet's stylesheet had not applied yet), which shipped a 2px iframe
   and collapsed the whole component to a sliver. A ResizeObserver re-reports whenever
   the content actually changes size, so late-loading tiles/CSS cannot strand a bad value. */
function fitHeight(){
  var w = document.getElementById("wrap");
  var h = w ? Math.ceil(w.getBoundingClientRect().height) : 0;
  if (!h) h = document.body.scrollHeight;
  if (h > 0) send("streamlit:setFrameHeight", {height: h + 4});
}
if (typeof ResizeObserver !== "undefined") {
  var __ro = new ResizeObserver(function(){ fitHeight(); });
  addEventListener("DOMContentLoaded", function(){
    var w = document.getElementById("wrap"); if (w) __ro.observe(w);
  });
}
addEventListener("load", fitHeight);
setTimeout(fitHeight, 250); setTimeout(fitHeight, 1200);

var ECON = [], SOON = [], selected = null, mode = "globe", booted = false, themeName = "dark";
window.__ECON = [];

window.addEventListener("message", function(e){
  if (!e.data || e.data.type !== "streamlit:render") return;
  var a = e.data.args || {};
  ECON = a.economies || []; SOON = a.upcoming || []; window.__ECON = ECON;
  if (!booted) { selected = a.selected || null; booted = true; }
  themeName = a.theme || "dark";
  applyTokens(a.tokens || {});
  renderNames(); paint(); if (window.__mapPaint) window.__mapPaint(); fitHeight();
});

function applyTokens(t){ for (var k in t) document.documentElement.style.setProperty(k, t[k]); }

/* The name buttons are not a convenience — they are the single-pointer/keyboard route to
   the same choice, so spinning the globe is never the ONLY way to pick a country
   (WCAG 2.2 "dragging movements"). This was dropped by accident when the flat map replaced
   the stretched texture, which left the bar empty and every render throwing. */
function renderNames(){
  var box = document.getElementById("names"); if (!box) return;
  box.innerHTML = "";
  ECON.forEach(function(c){
    var b = document.createElement("button");
    b.className = "name"; b.type = "button"; b.textContent = c.name;
    b.setAttribute("aria-pressed", String(c.iso === selected));
    b.onclick = function(){ choose(c.iso); };
    box.appendChild(b);
  });
}

function choose(iso){ selected = iso; renderNames(); paint();
  if (window.__mapPaint) window.__mapPaint(); setValue(iso); }
window.__choose = choose;

function setMode(m){
  mode = m;
  document.getElementById("bGlobe").setAttribute("aria-pressed", String(m === "globe"));
  document.getElementById("bMap").setAttribute("aria-pressed", String(m === "map"));
  /* crossfade: both layers stay mounted, so the WebGL context is never torn down and the
     switch reads as one continuous move rather than a hard cut */
  document.getElementById("globe").classList.toggle("hide", m !== "globe");
  document.getElementById("flat").classList.toggle("show", m === "map");
  document.getElementById("hint").textContent = m === "globe"
    ? "Drag to spin · click the globe for the map"
    : "Scroll to zoom · drag to pan · click a country";
  if (m === "map" && window.__mapReady) window.__mapReady();
}

document.getElementById("bGlobe").onclick = function(){ setMode("globe"); };
document.getElementById("bMap").onclick = function(){ setMode("map"); };

function paint(){ if (window.__globePaint) window.__globePaint(selected); }

send("streamlit:componentReady", {apiVersion:1});
fitHeight();
</script>


<script>
/* -- Flat map: real tiled cartography ----------------------------------------
   This used to be the globe's 2048px texture stretched to fill, so zooming in only
   magnified pixels. Leaflet + Esri raster tiles fetch the right tile for each zoom
   level, so the map stays sharp all the way in, and world-atlas country polygons make
   whole countries clickable instead of just a marker dot. Same stack the reference
   project (ftulabs/law, components/mapflat.ts) uses. */
(function(){
  var map = null, geoLayer = null, markers = [], initialised = false, base = null;

  var TILES = {
    light: { url:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
             attr:'Tiles &copy; <a href="https://www.esri.com/">Esri</a> - World Topographic Map' },
    dark:  { url:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
             attr:'Tiles &copy; <a href="https://www.esri.com/">Esri</a> - World Imagery' }
  };
  /* world-atlas tags each country with a UN M49 numeric id. Only the codes this tool
     shows are listed; the full 200-row table would be dead weight here. */
  var M49 = { "702":"SG", "036":"AU", "458":"MY", "764":"TH", "156":"CN", "356":"IN",
              "360":"ID", "643":"RU", "418":"LA", "496":"MN", "626":"TL" };

  function isoOf(f){
    if (!f || f.id == null) return null;
    var raw = String(f.id), pad = raw.length < 3 ? ("00" + raw).slice(-3) : raw;
    return M49[pad] || M49[raw] || null;
  }
  function isLive(iso){ return (window.__ECON || []).some(function(c){ return c.iso === iso; }); }
  function nameOf(iso){
    var all = (window.__ECON || []).concat(SOON || []);
    for (var i = 0; i < all.length; i++) if (all[i].iso === iso) return all[i].name;
    return iso;
  }
  function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || "#38bdf8"; }
  function tiles(){ return TILES[themeName === "light" ? "light" : "dark"]; }

  function styleFor(iso){
    if (iso === selected)
      return { color: cssv("--good"), weight: 2.2, opacity: 1, fillColor: cssv("--good"), fillOpacity: 0.45 };
    if (isLive(iso))
      return { color: cssv("--accent"), weight: 1.6, opacity: 0.95, fillColor: cssv("--accent"), fillOpacity: 0.22 };
    return { color: "#94a3b8", weight: 0.8, opacity: 0.5, fillColor: "#94a3b8", fillOpacity: 0.10 };
  }

  window.__mapReady = function(){
    if (initialised || typeof L === "undefined") return;
    initialised = true;
    map = L.map("lmap", { center:[6, 112], zoom:3, minZoom:2, maxZoom:12,
                          zoomControl:true, worldCopyJump:true, scrollWheelZoom:true });
    base = L.tileLayer(tiles().url, { attribution: tiles().attr, maxZoom:19, detectRetina:true }).addTo(map);

    if (typeof topojson !== "undefined") {
      fetch("https://unpkg.com/world-atlas@2.0.2/countries-50m.json")
        .then(function(r){ return r.json(); })
        .then(function(topo){
          var fc = topojson.feature(topo, topo.objects.countries);
          var feats = fc.features.filter(function(f){ return isoOf(f) !== null; });
          geoLayer = L.geoJSON({ type:"FeatureCollection", features:feats }, {
            style: function(f){ return styleFor(isoOf(f)); },
            onEachFeature: function(f, layer){
              var iso = isoOf(f), live = isLive(iso);
              layer.bindTooltip(nameOf(iso) + (live ? "" : " - not available yet"),
                                { sticky:true, direction:"top", className:"geo-tip" });
              if (!live) return;
              layer.on("click", function(){ window.__choose(iso); });
              layer.on("mouseover", function(e){ e.target.setStyle({ fillOpacity:0.42, weight:2.4 }); e.target.bringToFront(); });
              layer.on("mouseout",  function(e){ e.target.setStyle(styleFor(iso)); });
            }
          }).addTo(map);
          window.__mapPaint();
        })
        .catch(function(){ /* offline: tiles + markers still work */ });
    }
    window.__mapPaint();
    setTimeout(function(){ if (map) map.invalidateSize(); }, 80);
  };

  window.__mapPaint = function(){
    if (!map) return;
    var want = tiles();
    if (base && base._url !== want.url) {          /* basemap follows the app theme */
      map.removeLayer(base);
      base = L.tileLayer(want.url, { attribution: want.attr, maxZoom:19, detectRetina:true }).addTo(map);
      base.bringToBack();
    }
    if (geoLayer) geoLayer.eachLayer(function(l){ l.setStyle(styleFor(isoOf(l.feature))); });
    markers.forEach(function(m){ map.removeLayer(m); });
    markers = [];
    var all = (window.__ECON || []).map(function(c){ return [c, true]; })
              .concat((SOON || []).map(function(c){ return [c, false]; }));
    all.forEach(function(pair){
      var c = pair[0], live = pair[1], on = c.iso === selected;
      var col = on ? cssv("--good") : (live ? cssv("--accent") : "#94a3b8");
      var m = L.circleMarker([c.lat, c.lon], {
        radius: on ? 8 : (live ? 6 : 4), color: col, fillColor: col,
        fillOpacity: live ? 0.95 : 0.55, weight: 2 });
      m.bindTooltip(c.name + (live ? "" : " - not available yet"),
                    { direction:"top", offset:[0,-6], className:"geo-tip" });
      if (live) m.on("click", function(){ window.__choose(c.iso); });
      m.addTo(map); markers.push(m);
    });
  };
})();
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const TEX = "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/textures/planets/";
/* #flatimg was the flat map's stretched earth texture, replaced by real Leaflet tiles.
   The element is gone but this line survived, so it threw at module top level — and
   because that is the first statement in the module, EVERY line below it (the entire
   globe) never ran. */

const mount = document.getElementById("globe");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

try {
  const W = () => mount.clientWidth || 600;
  const H = () => mount.clientHeight || 300;
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(38, 2, 0.1, 100);
  cam.position.set(0, 0, 3.05);
  const rnd = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  rnd.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  rnd.setClearColor(0x000000, 0);
  mount.appendChild(rnd.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(4, 2, 4); scene.add(sun);
  const rim = new THREE.DirectionalLight(0x6aa7ff, 0.45); rim.position.set(-4, 1, -3); scene.add(rim);

  const ld = new THREE.TextureLoader(); ld.setCrossOrigin("anonymous");
  const earth = new THREE.Mesh(
    new THREE.SphereGeometry(1, 64, 64),
    new THREE.MeshPhongMaterial({
      map: ld.load(TEX + "earth_atmos_2048.jpg"),
      normalMap: ld.load(TEX + "earth_normal_2048.jpg"),
      specularMap: ld.load(TEX + "earth_specular_2048.jpg"),
      specular: new THREE.Color(0x334466), shininess: 12 }));
  scene.add(earth);

  const clouds = new THREE.Mesh(
    new THREE.SphereGeometry(1.012, 64, 64),
    new THREE.MeshPhongMaterial({ map: ld.load(TEX + "earth_clouds_2048.png"),
      transparent: true, opacity: 0.3, depthWrite: false }));
  scene.add(clouds);

  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(1.10, 40, 40),
    new THREE.ShaderMaterial({ transparent: true, side: THREE.BackSide,
      uniforms: { c: { value: 0.5 }, p: { value: 4.0 } },
      vertexShader: "varying vec3 vN; void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
      fragmentShader: "uniform float c,p; varying vec3 vN; void main(){float i=pow(c-dot(vN,vec3(0,0,1)),p); gl_FragColor=vec4(0.24,0.62,0.98,1.0)*i;}" })));

  // lat/lon -> point on the sphere, so markers sit on real geography
  const toVec = (lat, lon, r) => {
    const a = (90 - lat) * Math.PI / 180, b = (lon + 180) * Math.PI / 180;
    return new THREE.Vector3(-r * Math.sin(a) * Math.cos(b), r * Math.cos(a), r * Math.sin(a) * Math.sin(b));
  };
  const markers = new THREE.Group(); earth.add(markers);

  window.__globePaint = (sel) => {
    while (markers.children.length) markers.remove(markers.children[0]);
    (window.__ECON || []).forEach(c => {
      const on = c.iso === sel;
      const dot = new THREE.Mesh(new THREE.SphereGeometry(on ? 0.036 : 0.024, 16, 16),
        new THREE.MeshBasicMaterial({ color: on ? 0x34d399 : 0x38bdf8 }));
      dot.position.copy(toVec(c.lat, c.lon, 1.02));
      dot.userData.iso = c.iso; markers.add(dot);
      const halo = new THREE.Mesh(new THREE.SphereGeometry(on ? 0.062 : 0.046, 16, 16),
        new THREE.MeshBasicMaterial({ color: on ? 0x34d399 : 0x38bdf8, transparent: true, opacity: 0.22 }));
      halo.position.copy(dot.position); markers.add(halo);
    });
  };

  const ctl = new OrbitControls(cam, rnd.domElement);
  ctl.enablePan = false; ctl.enableZoom = false;
  ctl.enableDamping = true; ctl.dampingFactor = 0.08;
  ctl.autoRotate = !reduce; ctl.autoRotateSpeed = 0.5; ctl.rotateSpeed = 0.5;

  // A click on a marker selects it; a click on empty globe opens the flat map. A drag
  // (moved more than a few px) is a rotation, never a selection.
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  let down = null;
  rnd.domElement.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY }; });
  rnd.domElement.addEventListener("pointerup", e => {
    if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) { down = null; return; }
    down = null;
    const r = rnd.domElement.getBoundingClientRect();
    ptr.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    ptr.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(ptr, cam);
    const hit = ray.intersectObjects(markers.children, false)[0];
    if (hit && hit.object.userData.iso) window.__choose(hit.object.userData.iso);
    else document.getElementById("bMap").click();
  });

  const clock = new THREE.Clock();
  (function loop(){
    const dt = clock.getDelta();
    clouds.rotation.y += 0.015 * dt;
    ctl.update(); rnd.render(scene, cam);
    requestAnimationFrame(loop);
  })();

  const resize = () => { rnd.setSize(W(), H()); cam.aspect = W() / Math.max(H(), 1); cam.updateProjectionMatrix(); };
  addEventListener("resize", resize); resize();
} catch (err) {
  // No WebGL: fall back to the flat map, which is fully usable on its own.
  document.getElementById("bGlobe").disabled = true;
  document.getElementById("bMap").click();
}
</script>
</body>
</html>
