# VeriTrade theme. DARK (brand navy) is the default; users switch Light/Dark via the
# native menu: ⋮ (top-right) → Settings → Choose app theme. The app's custom palette
# (frontend/app.py) follows st.context.theme automatically.
[theme]
base = "dark"
primaryColor = "#3aa0ff"            # electric blue accent
backgroundColor = "#0a1024"         # deep navy
secondaryBackgroundColor = "#0d1630"# panel navy (sidebar, inputs)
textColor = "#e8eeff"               # near-white ink
font = "serif"

[server]
runOnSave = true
