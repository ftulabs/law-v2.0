# VeriTrade design system — the single source of truth for the app's look.
#
# Why this file matters: Streamlit's own widgets (labels, tabs, inputs, buttons,
# dataframes) are styled from THIS config, not from our CSS. It defines BOTH light and
# dark variants below; when only one existed, light mode kept painting native widgets
# with dark chrome while our custom HTML went light. frontend/theme.py styles OUR markup
# from the same hex values — the two must stay in step.
#
# Palette profile: accessible / public-sector. Grounded slate neutrals with a deep blue
# (sky-700) rather than a bright product blue, and an OFF-WHITE page ground so white
# cards read as layered surfaces instead of dissolving into the background.

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap, monospace"
baseFontSize = 16
headingFontWeights = [700, 700, 600, 600, 600, 600]
baseRadius = "0.65rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#0369a1"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#020617"
linkColor = "#0369a1"
borderColor = "#e2e8f0"
dataframeBorderColor = "#e2e8f0"
dataframeHeaderBackgroundColor = "#f1f5f9"
codeBackgroundColor = "#e8ecf1"
codeTextColor = "#020617"
greenColor = "#15803d"
greenTextColor = "#15803d"
greenBackgroundColor = "#e7f4ec"
yellowColor = "#a16207"
yellowTextColor = "#a16207"
yellowBackgroundColor = "#faf1dd"
orangeColor = "#a16207"
orangeTextColor = "#a16207"
orangeBackgroundColor = "#faf1dd"
redColor = "#dc2626"
redTextColor = "#dc2626"
redBackgroundColor = "#fdeaea"
grayColor = "#64748b"
grayTextColor = "#475569"
grayBackgroundColor = "#f1f5f9"
blueColor = "#0369a1"
blueTextColor = "#0369a1"
blueBackgroundColor = "#e0f2fe"

[theme.dark]
primaryColor = "#38bdf8"
backgroundColor = "#020617"
secondaryBackgroundColor = "#0f172a"
textColor = "#f1f5f9"
linkColor = "#38bdf8"
borderColor = "#1e293b"
dataframeBorderColor = "#1e293b"
dataframeHeaderBackgroundColor = "#0f172a"
codeBackgroundColor = "#1e293b"
codeTextColor = "#f1f5f9"
greenColor = "#34d399"
greenTextColor = "#34d399"
greenBackgroundColor = "#0d2a1d"
yellowColor = "#fbbf24"
yellowTextColor = "#fbbf24"
yellowBackgroundColor = "#2b2208"
orangeColor = "#fbbf24"
orangeTextColor = "#fbbf24"
orangeBackgroundColor = "#2b2208"
redColor = "#f87171"
redTextColor = "#f87171"
redBackgroundColor = "#2e1315"
grayColor = "#64748b"
grayTextColor = "#94a3b8"
grayBackgroundColor = "#0f172a"
blueColor = "#38bdf8"
blueTextColor = "#38bdf8"
blueBackgroundColor = "#0c2d43"

[server]
runOnSave = true
# serves docs/whitepaper.html + docs/landing.html + docs/fonts.html at /app/static/…
enableStaticServing = true

# Streamlit's source watcher walks every imported module's `__path__` to decide what to
# watch. `transformers` resolves that attribute through a LAZY importer, so the walk imports
# submodules — including ones that need `torchvision`, which we do not install. Each miss is
# caught and logged as a full traceback. A single session printed 368 of them plus 808
# "[transformers] Accessing __path__" lines: 9,344 lines of log for an app that was working
# perfectly. Nothing was broken; it just looked broken, which for someone reading the terminal
# during a 30-minute install is the same thing.
#
# "none" turns the watcher off. The cost is that editing a .py no longer hot-reloads the
# browser — a developer's convenience, not a reviewer's. For that, override it per shell:
#   STREAMLIT_SERVER_FILE_WATCHER_TYPE=auto streamlit run frontend/app.py
fileWatcherType = "none"
