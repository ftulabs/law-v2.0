# VeriTrade design system — the single source of truth for the app's look.
#
# Why this file matters: Streamlit's own widgets (labels, tabs, inputs, buttons,
# dataframes) are styled from THIS config, not from our CSS. Previously only a
# `base = "dark"` theme existed, so in light mode the native widgets kept painting
# themselves with dark chrome while our custom HTML went light — the mismatch users
# reported. Defining BOTH [theme.light] and [theme.dark] fixes it at the root: each
# mode now has a complete, matching palette, and the app follows whichever one is
# active (see `st.context.theme.type` in frontend/theme.py).
#
# Typography is registered here too, so native widgets render in Inter — the same
# family as the custom cards/headings — instead of Streamlit's default sans.

[theme]
# "<name>:<url>" lets Streamlit load the font itself rather than relying on our CSS @import.
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap, monospace"
baseFontSize = 16
headingFontWeights = [700, 700, 600, 600, 600, 600]
baseRadius = "0.65rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#2563eb"              # single accent — matches --accent
backgroundColor = "#ffffff"           # --paper
secondaryBackgroundColor = "#f5f8fc"  # --paper-2 (sidebar, inputs)
textColor = "#0f172a"                 # --ink
linkColor = "#2563eb"
borderColor = "#dbe2ec"               # --rule
dataframeBorderColor = "#dbe2ec"
dataframeHeaderBackgroundColor = "#f5f8fc"
codeBackgroundColor = "#eaeff6"       # --paper-3
codeTextColor = "#0f172a"
# semantic colours (st.success / st.warning / st.error) tied to the confidence
# traffic-light so status reads the same everywhere
greenColor = "#15803d"
greenTextColor = "#15803d"
greenBackgroundColor = "#e7f4ec"
yellowColor = "#a16207"
yellowTextColor = "#a16207"
yellowBackgroundColor = "#faf1dd"
orangeColor = "#a16207"
orangeTextColor = "#a16207"
orangeBackgroundColor = "#faf1dd"
redColor = "#dc2626"
redTextColor = "#dc2626"
redBackgroundColor = "#fdeaea"
grayColor = "#7a879c"
grayTextColor = "#48566b"
grayBackgroundColor = "#f5f8fc"
blueColor = "#2563eb"
blueTextColor = "#2563eb"
blueBackgroundColor = "#e6effe"

[theme.dark]
primaryColor = "#4f9cff"
backgroundColor = "#0b1120"
secondaryBackgroundColor = "#111a2b"
textColor = "#e9eef8"
linkColor = "#4f9cff"
borderColor = "#26334d"
dataframeBorderColor = "#26334d"
dataframeHeaderBackgroundColor = "#111a2b"
codeBackgroundColor = "#1a2740"
codeTextColor = "#e9eef8"
greenColor = "#34d399"
greenTextColor = "#34d399"
greenBackgroundColor = "#123122"
yellowColor = "#fbbf24"
yellowTextColor = "#fbbf24"
yellowBackgroundColor = "#322709"
orangeColor = "#fbbf24"
orangeTextColor = "#fbbf24"
orangeBackgroundColor = "#322709"
redColor = "#f87171"
redTextColor = "#f87171"
redBackgroundColor = "#341417"
grayColor = "#6f7d99"
grayTextColor = "#a3b0c9"
grayBackgroundColor = "#111a2b"
blueColor = "#4f9cff"
blueTextColor = "#4f9cff"
blueBackgroundColor = "#12213c"

[server]
runOnSave = true
# serves docs/whitepaper.html + docs/landing.html at /app/static/…
enableStaticServing = true
