# VeriTrade theme. A clean, high-contrast, sans-serif research tool. DARK is the
# default; users switch Light/Dark with the toggle at the top-right of the app. The
# app's custom palette (frontend/app.py) owns most styling and follows the toggle.
[theme]
base = "dark"
primaryColor = "#2f7fe6"            # trustworthy blue accent (both themes)
backgroundColor = "#0b1120"         # deep slate
secondaryBackgroundColor = "#131c2e"# panel (sidebar, inputs)
textColor = "#e8edf7"               # near-white ink
font = "sans-serif"

[server]
runOnSave = true
# serve files in frontend/static/ at /app/static/… — used for the white paper page
enableStaticServing = true
