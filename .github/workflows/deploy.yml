name: Deploy to Sager

on:
  push:
    branches: [main]
  workflow_dispatch:

# Chỉ chạy 1 deploy tại một thời điểm; deploy mới cancel deploy đang chạy
concurrency:
  group: deploy-sager
  cancel-in-progress: true

jobs:
  # ── CI trước, deploy sau ──────────────────────────────────────────────────
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Sager (x64)
    needs: ci
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & restart VeriTrade
        # The API keys are handed to the script, which writes them into the host's env file.
        # An unset secret is an empty string and changes nothing on the box, so adding one
        # here can only ever fix a stale key, never blank a working one.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash deploy/redeploy.sh

      - name: Does the deployed key actually work?
        # "A key is configured" and "a key can answer" are different questions, and the
        # dashboard was only ever asking the first. This asks the second, against the
        # container that is now serving, so a revoked key is a red deploy rather than a
        # dashboard that looks healthy and fails on every run.
        run: |
          docker exec veritrade python -c "
          from backend.providers import get_llm_provider
          llm = get_llm_provider()
          print('grader:', llm.name, llm.model_version)
          print(llm.complete_json('Return ONLY JSON.', 'Answer with {\"ok\": true}'))
          "

      - name: Health check
        run: |
          echo "App URL: https://veritrade.ftu.fyi"
          curl -sf --retry 5 --retry-delay 5 \
               https://veritrade.ftu.fyi/_stcore/health \
            && echo "✓ Public URL healthy" \
            || echo "⚠️  Public URL chưa sẵn sàng (tunnel có thể đang propagate)"
