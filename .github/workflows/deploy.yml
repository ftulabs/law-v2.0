name: Deploy to Sager

on:
  push:
    branches: [main]
  workflow_dispatch:

# Chỉ chạy 1 deploy tại một thời điểm; deploy mới cancel deploy đang chạy
concurrency:
  group: deploy-sager
  cancel-in-progress: true

jobs:
  # ── CI trước, deploy sau ──────────────────────────────────────────────────
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Sager (x64)
    needs: ci
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & restart VeriTrade
        # The API keys are handed to the script, which writes them into the host's env file.
        # An unset secret is an empty string and changes nothing on the box, so adding one
        # here can only ever fix a stale key, never blank a working one.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash deploy/redeploy.sh

      - name: Does the deployed key actually work?
        # "A key is configured" and "a key can answer" are different questions, and the
        # dashboard was only ever asking the first. This asks the second, against the
        # container that is now serving, so a revoked key is a red deploy rather than a
        # dashboard that looks healthy and fails on every run.
        # Retried, because the question is "can the configured grader answer" and a single
        # dropped connection is not an answer to it. 2026-09-18: this step failed the deploy
        # with APIConnectionError while the grader was in fact healthy — the same call
        # succeeded three times in a row minutes later, and the container it was testing was
        # serving correctly the whole time. A revoked key or a misconfigured endpoint still
        # fails, because it fails on every attempt; only the blip is absorbed.
        run: |
          for attempt in 1 2 3; do
            if docker exec veritrade python -c "
          from backend.providers import get_llm_provider
          llm = get_llm_provider()
          print('grader:', llm.name, llm.model_version)
          # pool_report exists only on the self-hosted cluster provider; a hosted one has no pool.
          print(llm.pool_report() if hasattr(llm, 'pool_report') else 'hosted provider, no node pool')
          print(llm.complete_json('Return ONLY JSON.', 'Answer with {\"ok\": true}'))
          "; then
              exit 0
            fi
            echo "⚠️  grader check failed on attempt ${attempt}/3"
            sleep 15
          done
          echo "::error::the configured grader did not answer in three attempts"
          exit 1

      - name: Health check
        run: |
          echo "App URL: https://veritrade.ftu.fyi"
          curl -sf --retry 5 --retry-delay 5 \
               https://veritrade.ftu.fyi/_stcore/health \
            && echo "✓ Public URL healthy" \
            || echo "⚠️  Public URL chưa sẵn sàng (tunnel có thể đang propagate)"
