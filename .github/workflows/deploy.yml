name: Deploy to TX2

on:
  push:
    branches: [main]
  workflow_dispatch:

# Chỉ chạy 1 deploy tại một thời điểm; deploy mới cancel deploy đang chạy
concurrency:
  group: deploy-tx2
  cancel-in-progress: true

jobs:
  # ── CI trước, deploy sau ──────────────────────────────────────────────────
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to TX2 (arm64)
    needs: ci
    # Repo-scoped self-hosted runner "tx2-veritrade" is the only self-hosted arm64
    # runner on ftulabs/law-v2.0, so [self-hosted, arm64] targets it unambiguously
    # without needing a device-specific label.
    runs-on: [self-hosted, arm64]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & restart VeriTrade
        run: bash deploy/redeploy.sh

      - name: Health check
        run: |
          echo "App URL: https://veritrade.ftu.fyi"
          curl -sf --retry 5 --retry-delay 5 \
               https://veritrade.ftu.fyi/_stcore/health \
            && echo "✓ Public URL healthy" \
            || echo "⚠️  Public URL chưa sẵn sàng (tunnel có thể đang propagate)"
