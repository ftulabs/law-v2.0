# Publish paper/ to its own repository and to Overleaf, on every push that
# touches it.
#
# Two hops, one source of truth:
#
#   law-v2.0/paper/  --(1)-->  ftulabs/rdtii-bench-paper  (a small repository
#                                                          Overleaf can import)
#                    --(2)-->  git.overleaf.com/<id>      (the live project,
#                                                          updated with no clicks)
#
# Direction is deliberate. Overleaf cannot run the pipeline: everything under
# paper/generated/ and paper/cases/ comes from `ledger figures` and
# `bench.case_studies`, and editing it in Overleaf would make `ledger verify`
# fail on the next build. So the repository is the source of truth and Overleaf
# holds a snapshot of it.
#
# Neither push is forced. If someone has edited the Overleaf project, hop 2
# fails rather than overwriting their paragraph -- recover it with
# `tools/overleaf.sh pull`, commit, and the next push succeeds.
#
# A hop whose credentials are missing is SKIPPED, not failed: half-configured is
# a normal state while this is being set up. It is never silent, though -- the
# job summary always says which hops ran, because "the paper quietly stopped
# reaching Overleaf" is the exact failure mode this repository is about.
name: paper

on:
  push:
    branches: [main]
    paths:
      - 'paper/**'
      - '.github/workflows/paper.yml'
  workflow_dispatch:

# Two pushes to the same two remotes must not interleave.
concurrency:
  group: paper-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PAPER_REPO: ${{ vars.PAPER_REPO }}
      PAPER_REPO_TOKEN: ${{ secrets.PAPER_REPO_TOKEN }}
      OVERLEAF_PROJECT_ID: ${{ vars.OVERLEAF_PROJECT_ID }}
      OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the paper is self-contained
        run: |
          set -euo pipefail
          # Overleaf compiles what it is given and nothing else, so everything
          # paper.tex inputs has to be committed. Checking here turns "the
          # Overleaf build is broken" into "this job failed, and named the file".
          missing=0
          for f in paper/paper.tex paper/references.bib paper/latexmkrc \
                   paper/generated/values.tex paper/generated/claims.tex \
                   paper/generated/assets.json paper/cases/cases.tex \
                   paper/style/iclr2027/iclr2027_conference.sty \
                   paper/style/iclr2027/iclr2027_conference.bst; do
            if [ ! -f "$f" ]; then echo "missing: $f"; missing=1; fi
          done
          for rel in $(grep -ho '\\input{[^}]*}' paper/paper.tex paper/cases/cases.tex \
                       | sed 's/.*{\(.*\)}/\1/'); do
            if [ ! -f "paper/$rel" ] && [ ! -f "paper/$rel.tex" ]; then
              echo "paper.tex inputs $rel, which is not committed"
              missing=1
            fi
          done
          exit $missing

      - name: Mirror to the paper repository
        run: |
          set -euo pipefail
          if [ -z "${PAPER_REPO}" ] || [ -z "${PAPER_REPO_TOKEN}" ]; then
            echo "skipped: set the PAPER_REPO variable and the PAPER_REPO_TOKEN secret."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${PAPER_REPO_TOKEN}@github.com/${PAPER_REPO}" target
          # paper/ becomes the repository root, so every relative path in
          # paper.tex -- generated/, cases/, style/ -- resolves unchanged, and
          # Overleaf can import it without being told where the main file is.
          rsync -a --delete --exclude '.git' paper/ target/
          cd target
          git config user.name  "ledger"
          git config user.email "ledger@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "paper repository is already up to date."
          else
            git commit -m "paper from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
            git push origin HEAD:main
            echo "mirrored to ${PAPER_REPO}"
          fi

      - name: Push to Overleaf
        run: |
          set -euo pipefail
          if [ -z "${OVERLEAF_PROJECT_ID}" ] || [ -z "${OVERLEAF_TOKEN}" ]; then
            echo "skipped: set the OVERLEAF_PROJECT_ID variable and the OVERLEAF_TOKEN secret."
            exit 0
          fi
          # Overleaf's git remote has no branches; master is the only ref.
          git clone --depth 1 \
            "https://git:${OVERLEAF_TOKEN}@git.overleaf.com/${OVERLEAF_PROJECT_ID}" overleaf
          rsync -a --delete --exclude '.git' paper/ overleaf/
          cd overleaf
          git config user.name  "ledger"
          git config user.email "ledger@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Overleaf is already up to date."
          else
            git commit -m "ledger: paper from ${GITHUB_SHA}"
            git push origin master
            echo "pushed to Overleaf project ${OVERLEAF_PROJECT_ID}"
          fi

      - name: Report which hops are configured
        if: always()
        run: |
          set -euo pipefail
          mirror=no
          overleaf=no
          if [ -n "${PAPER_REPO}" ] && [ -n "${PAPER_REPO_TOKEN}" ]; then mirror=yes; fi
          if [ -n "${OVERLEAF_PROJECT_ID}" ] && [ -n "${OVERLEAF_TOKEN}" ]; then overleaf=yes; fi
          {
            echo "| hop | configured |"
            echo "| --- | --- |"
            echo "| paper repository (PAPER_REPO + PAPER_REPO_TOKEN) | ${mirror} |"
            echo "| Overleaf (OVERLEAF_PROJECT_ID + OVERLEAF_TOKEN) | ${overleaf} |"
            echo ""
            echo "paper/README.md has the setup for either."
          } >> "$GITHUB_STEP_SUMMARY"
