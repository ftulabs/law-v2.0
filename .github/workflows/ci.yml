name: VeriTrade CI

# Installs the full stack, runs the test suite, and smoke-tests the end-to-end pipeline,
# so a reviewer gets a one-command reproducible environment. The default OCR engine is
# RapidOCR (real raster OCR, pip-only); MarkItDown reads text layers only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:   # cho phép deploy.yml gọi CI như một dependency

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    # Deploys are gated on this job, so a hang here is a hang of the deployed site. Without a
    # bound it inherits GitHub's six-hour default: one test that pulled model weights from a
    # cold runner held the site on two-hour-old code with the run still showing "in progress",
    # which reads as slow rather than stuck. Thirty minutes is ~3x the healthy run.
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (includes MarkItDown)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify the default OCR engine is available
        run: |
          python -c "from backend.config import settings; from backend.providers import registry as r; d=settings.ocr_provider; a=r.ocr_availability(d); print('default OCR =', d, a); assert a.ready, a.note"

      - name: Byte-compile all modules
        run: python -m compileall -q backend frontend

      # The suite is what a reviewer runs first ("pytest tests/" is in the README), so CI has to
      # run it too. It did not, which is how a schema change reached main four times with the
      # smoke test red: the tests knew, and nothing asked them.
      - name: Run the test suite
        run: pytest tests/ -q

      - name: Smoke-test pipeline (mock LLM, offline samples) and validate the CSV template
        run: |
          python -m backend.cli run-pipeline --economy SG --pillar 6 --pillar 7 --use-samples
          python - <<'PY'
          import csv, glob, json, os
          # Import the column list rather than repeating it. A second copy of the schema is a
          # copy that drifts: this step held the Round-1 thirteen and failed every build for a
          # day after Language of Source was added, reporting a "header mismatch" for a header
          # that was correct. tests/test_final_round.py is what pins the names themselves
          # against the final-round template.
          from backend.schemas import SUBMISSION_COLUMNS
          # Newest by MTIME, not by name. On a clean runner outputs/ holds one file so the
          # difference never shows, which is exactly why it survived: reproducing this step
          # locally picked up a stale CSV from a previous run and reported a header mismatch
          # that did not exist.
          cands = [f for f in glob.glob("outputs/*.csv") if "_scored" not in f]
          f = max(cands, key=os.path.getmtime)
          rows = list(csv.reader(open(f, encoding="utf-8-sig")))
          assert rows[0] == SUBMISSION_COLUMNS, (
              f"CSV header does not match backend.schemas.SUBMISSION_COLUMNS\n"
              f"  exported: {rows[0]}\n  expected: {SUBMISSION_COLUMNS}")
          assert len(rows) > 1, "no data rows produced"
          j = max(glob.glob("outputs/*.json"), key=os.path.getmtime)
          data = json.load(open(j, encoding="utf-8"))
          used = {m["ocr_quality"]["provider"] for m in data["mappings"] if m["ocr_quality"]["used"]}
          langs = {r[SUBMISSION_COLUMNS.index("Language of Source")] for r in rows[1:]}
          print(f"columns: {len(rows[0])} | rows: {len(rows)-1} | OCR: {used or 'none'} "
                f"| Language of Source: {sorted(langs)}")
          print("CSV header OK ✓")
          PY

      - name: Upload example outputs
        uses: actions/upload-artifact@v4
        with:
          name: veritrade-outputs-py${{ matrix.python-version }}
          path: outputs/*.csv
          if-no-files-found: warn
