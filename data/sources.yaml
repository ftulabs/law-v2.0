  - economy: IN
    name: SEBI (regulations)
    base_url: https://www.sebi.gov.in
    adapter: websearch
    site: sebi.gov.in
    pdf_only: true
    per_query: 6
    verified: false
    queries_p7:
      - Listing Obligations Disclosure Requirements Regulations 2015
    notes: >
      SEBI's LODR Regulations 2015 (records/e-disclosure retention) are cited under 7.3.
