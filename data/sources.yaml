    reachable: "2026-08-28: HTTP 200, document body 13.8k chars of real statute text, cp1251, ~2s"
    robots_read: "2026-08-28"
    note: >-
      A DIFFERENT host from publication.pravo.gov.ru, with a different robots.txt, and this one
      is "User-Agent: * / Disallow:" — nothing forbidden at all. The FETCH half of the Russian
      lane is solved here: `?doc_itself=&nd=<id>&page=1&rdk=0` returns the whole document body
      server-rendered. Two traps. (1) The encoding is windows-1251, not UTF-8; decoded as UTF-8
      it is mojibake that still "succeeds", which is the failure mode this project keeps
      meeting — query strings must also be cp1251-percent-encoded, not UTF-8. (2) The wrapper
      `?docbody=&nd=<id>` is a frameset carrying 586 characters of chrome; the body lives in
      its inner frame, so fetching the obvious URL yields a page that looks fine and contains
      no law.
      DISCOVERY is the open half. `?searchres=&bpas=cd00000&a1=<query>` accepts the query and
      reports a result count ("Аннотации: с 1 по 20", ten pages of them), but the rows are
      injected client-side: neither plain HTTP nor a default browser render surfaces a single
      nd= id (measured 2026-08-28, both routes, 25.2k rendered bytes, zero ids). The next thing
      to try is the XHR the list frame issues, or the rubricator/classifier browse, NOT more
      rendering of the same frame.
      Note also what the panel itself cites for Russia: 24 of 28 references are base.garant.ru
      and consultant.ru, commercial mirrors — only ONE is the official portal. So the answer
      key's URLs cannot be used as a discovery target; the law NAME is the join key, as in
      Round 1.

regulators:
  SG:
    - host: www.pdpc.gov.sg          # Personal Data Protection Commission
      remit: data_protection
      strategies: [sitemap, crawl, search]
    - host: www.imda.gov.sg          # Info-communications Media Development Authority
      remit: sectoral                # licences + telecom terms & conditions
      # crawl is required here: the licence conditions and service terms live under
      # /-/media/Imda/Files/... which the sitemap does not list.
      strategies: [sitemap, crawl, search]
      crawl_pages: 150
  AU:
    - host: www.oaic.gov.au          # Office of the Australian Information Commissioner
      remit: data_protection
      strategies: [sitemap, crawl, search]   # answers 403 to non-browser robots/sitemap fetches
    - host: www.homeaffairs.gov.au   # cyber security strategy
      remit: sectoral
      strategies: [search, crawl]
      crawl_pages: 80                # the strategy is an HTML page several levels down
  MY:
    - host: www.pdp.gov.my           # Jabatan Perlindungan Data Peribadi
      base: https://www.pdp.gov.my/ppdpv1
      remit: data_protection
      strategies: [wp_media, crawl, search]
