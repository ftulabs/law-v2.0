  - economy: MN
    name: Unified Legal Information System (legalinfo.mn)
    base_url: https://legalinfo.mn
    adapter: mn_legalinfo
    site: legalinfo.mn
    verified: true             # measured 2026-08-22: sitemap enumerates, export returns full text
    reachable: >-
      2026-08-22, third and correct reading. This entry has been wrong twice, in opposite
      directions, and both errors are kept here because each is a different way to misread a
      portal.
      (1) "12.4k Cyrillic characters in the body, so OCR is not on the critical path" — those
      characters are the navigation menu, a registration form, the alphabet index and a list of
      industry sectors. Zero article headings. That counted Cyrillic without checking it was the
      statute, the same mistake that had India recorded as a JS shell.
      (2) "No .doc or .docx downloads, unlike China; body retrieval is unsolved" — false, and
      falsifiable in one request. The detail page's own toolbar calls
      downloadAnnexFile(this, "", lawId), which static.js resolves to
      POST /mn/downloadFile?file=&lawId=N&fDownload=1. That returns the whole instrument.
      What is true: /sitemap.xml answers 200 with 36,833 distinct lawId values; the export is
      labelled .doc but the bytes are UTF-8 HTML; and Content-Disposition carries the law's
      Mongolian title, which is the only place a title is available without running JavaScript.
    document_format: html      # the ".doc" export is Word-flavoured HTML, not a binary
    ocr_required: false        # measured — there is no image layer anywhere on this route
    # Counts are the number of TITLES in data/catalogues/MN_titles.json each term matches,
    # measured — not guessed. Anything in the hundreds is a term that will bury the statute
    # under its own implementing paperwork even with MN_MAX_PER_QUERY.
    # Counts below are DISTINCT in-force instruments after the repealed/amending filters,
    # re-measured 2026-08-27 against the fleeting-vowel matcher. The previous counts were
    # taken with the plain-substring matcher and understated every term carrying
    # мэдээлэл, because that word cannot reach its own genitive мэдээллийн by substring.
    queries_p6:
      - хүний хувийн мэдээлэл      # 1 — Personal Data Protection Law (the key's 6.1, 6.2, 6.4)
      - мэдээлэл хамгаалах         # 5
      - нийтийн мэдээлэл           # 6 — Transparency of Public Information (the key's 6.3)
      # The key's OTHER 6.3 citation is a ministerial order, not an Act: the Minister of
      # Digital Development's A/90 regulation on processing sensitive, genetic and biometric
      # data. No term above reaches it — its title leads with ЭМЗЭГ, which appears in
      # neither of the two Acts — so a pillar-6 run could not cite what the panel cites.
      - эмзэг мэдээлэл               # 2 — the A/90 sensitive-data regulation (the key's 6.3)
      # Pillar 6 is about where data may go and what must be in place before it goes. Both
      # sit in these two as well as in the data-protection Act: the Cybersecurity Law carries
      # the infrastructure duties 6.3 asks about, and the Communications Law is where a
      # localisation or facility condition on a licensed operator would be written.
      - кибер аюулгүй                # 4 — Кибер аюулгүй байдлын тухай
      - '"харилцаа холбоо" тухай'  # 21 — Communications Law. QUOTED: see _query_parts —
    # `мэдээллийн аюулгүй` (information security) is a PILLAR-7 concept and is listed only
    # there. In the pillar-6 set it pulled in a drug-safety information report and a civil
    # aviation confidentiality rule — 200-word approving resolutions that are neither about
    # cross-border data nor, in any useful sense, about data at all.
    queries_p7:
      - хүний хувийн мэдээлэл      # 2
      - мэдээлэл хамгаалах         # 3
      - кибер аюулгүй              # 6 — Кибер аюулгүй байдлын тухай (the key's 7.2)
      - мэдээллийн аюулгүй         # 10
      - нийтийн мэдээлэл           # 6
      - эмзэг мэдээлэл               # 2 — A/90 sensitive-data regulation (DPO duties, 7.4)
      - цахим гарын                # 3 — Electronic Signature Law
      - төрийн нууц                # 15 — State Secrets (7.5)
      - архивын                    # 43 — Law on Archives (retention, 7.3)
      - '"харилцаа холбоо" тухай'  # 21 — Communications Law (the key's 7.3, sectoral).
      # QUOTED so холбоо must sit next to харилцаа: unquoted it also means "federation",
      # and Mongolia has one treaty Act per recognised state ("… Холбооны Улстай дипломат
      # харилцаа тогтоох тухай"), each of which matched all three words as a principal Act.
      - банкны тухай               # 84 — Banking Law (the key's 7.5); the broadest term here
    note: >-
      Discovery is the sitemap; titles come from data/catalogues/MN_titles.json, built once by
      tools/build_mn_catalogue.py because legalinfo.mn's listing pages render their rows in the
      browser and no server-rendered index carries a title. That file is a TABLE OF CONTENTS —
      id, title, byte size — with no provision text, no indicator and no mapping; bodies are
      fetched live on every run. Same arrangement Malaysia already uses.
      REMOVED, and the reason is worth keeping: `хилийн чанад` was in the pillar-6 set as
      "abroad". It matches 21 titles and every one of them is a customs regulation about
      processing GOODS abroad — "Барааг хилийн чанадад боловсруулах журам". A pillar-6 run
      returned seventeen documents of which twelve were those. The word `хилийн` does not
      appear even once in Mongolia's Personal Data Protection Law; its article 14 says
      `гадаад улс дахь` ("in a foreign state"). A term chosen from a dictionary rather than
      from the statute, and it cost the run its whole document set.

      Queries are Mongolian STEMS, not inflected forms: the language is agglutinative and each
      WORD of a query is matched as a substring of the title, so the stem "мэдээлэл" reaches
      "мэдээллийн" while the inflected "мэдээллийг" would reach nothing. Word-by-word rather
      than whole-phrase for two measured reasons: the Personal Data Protection Law is titled
      "ХҮНИЙ ХУВИЙН МЭДЭЭЛЭЛ …", not "ХУВЬ ХҮНИЙ …" (a phrase written from the English name
      misses it), and the portal's own filename for it omits a space —
      "МЭДЭЭЛЭЛХАМГААЛАХ" — which no phrase test survives.
      Check them with tools/audit_native_terms.py --economy MN.
