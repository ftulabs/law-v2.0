# Official national legal portals for Zone 1 LIVE discovery (--live mode).
#
# The judges provide only these ROOT portals; the app must search them itself. Each
# adapter below is CONFIG-DRIVEN so selectors can be tuned against the live site
# without touching code (portals change markup and apply bot rules).
#
# Fields:
#   search_url_template : {query} is URL-encoded and injected
#   result_link_selector: CSS selector for result <a> links
#   link_must_contain   : keep only result hrefs containing this substring (noise filter)
#   id_regex            : optional — extract an Act id from a result href ({id} below)
#   download_url_template: optional — turn a result into a fetchable body URL.
#                          placeholders: {href}=absolute result URL, {id}=id_regex match
#   verified            : has the selector been confirmed against the live site?
#
# ⚠ AU is JS-heavy (first results page is server-rendered; deep pagination needs
#   Playwright) and SG applies bot protection (a browser User-Agent is set in config
#   to get past the 403). Treat unverified selectors as live-tuning TODOs.

sources:
  - economy: SG
    name: Singapore Statutes Online
    base_url: https://sso.agc.gov.sg
    adapter: websearch                    # on-portal search is token-AJAX; web search reaches the same Acts
    verified: true
    notes: Full-text body via /Act/{id}?ViewType=Pdf (verified, httpx). Discovery via web search.

  - economy: AU
    name: Federal Register of Legislation
    base_url: https://www.legislation.gov.au
    adapter: au_api                       # uses the official OData JSON API (no scraping)
    api_base: https://api.prod.legislation.gov.au/v1/titles
    detail_url_template: https://www.legislation.gov.au/{id}
    verified: true
    notes: Official JSON API. $filter=contains(name,'<q>') and collection eq 'Act' → exact title hits.

  - economy: AU
    name: Federal Register of Legislation (full-text lane)
    base_url: https://www.legislation.gov.au
    adapter: websearch
    site: legislation.gov.au
    verified: true
    notes: >
      Content-based discovery lane: Google indexes the register's FULL TEXT (even epub
      internals), so descriptive obligation phrases ("records must not be held outside",
      "retain for a period of") find laws whose PROVISIONS contain the concept - no law
      names. Result URLs (Details/{id}, /{id}/latest, epub paths) are canonicalised to
      /{id}/latest; the name-only OData lane still provides exact title hits.

  - economy: MY
    name: Personal Data Protection Dept (Codes of Practice)
    base_url: https://www.pdp.gov.my
    adapter: websearch                    # registered sectoral Codes of Practice (banking, comms,
    site: www.pdp.gov.my                  # insurance, utilities…) live here, NOT on the AGC portal.
    pdf_only: true                        # keep the COP PDFs; the HTML pages are JS/nav wrappers.
    per_query: 10                         # these sit on ONE small site → pull more per query so the
                                          # whole sector set surfaces, not just the top 4.
    queries:                              # generic data-protection-code terms (sector words are
      # generic descriptors, not specific law titles). `filetype:pdf` is deliberate: without it Serper
      # ranks the /en/akta/ HTML wrapper pages above the actual code PDFs, and pdf_only drops them all.
      # With it, the sectoral code PDFs (financial, communications, insurance, utilities, aviation,
      # health…) surface directly.
      - personal data protection code of practice filetype:pdf
      - code of practice personal data filetype:pdf
      - personal data protection code of practice sector filetype:pdf
      - data protection code of practice industry filetype:pdf
      - personal data protection code of practice financial filetype:pdf
    verified: true
    notes: >
      Much of the MY P6/P7 answer key is registered Codes of Practice (Banking & Financial,
      Communications & Multimedia, Insurance, Utilities…) issued under PDPA by the PDP Department —
      subsidiary/sectoral instruments absent from the AGC principal-acts catalogue. Discovered via
      web search scoped to pdp.gov.my; PDFs only (the /en/akta/ pages are navigation shells).

  - economy: MY
    name: Laws of Malaysia (AGC)
    base_url: https://lom.agc.gov.my
    adapter: my_catalogue                 # the portal's OWN DataTables JSON catalogue (no Google)
    catalogue_url: https://lom.agc.gov.my/json-updated-2024.php
    referer: https://lom.agc.gov.my/principal.php?type=updated&lang=BI
    verified: true
    notes: >
      Google barely indexes lom.agc.gov.my (site: search returns only the homepage), so we hit the
      portal's own consolidated-principal-acts JSON (the grid behind principal.php?type=updated):
      ~880 in-force Acts, each with the English name (title field) + English PDF URL (_BI). We
      filter that catalogue by the same name-fragment queries used for AU (name-only matching).
      Many older PDFs are scanned → OCR. Multilingual (we take the English _BI PDF).

  - economy: MY
    name: Laws of Malaysia — Amendment Acts (AGC)
    base_url: https://lom.agc.gov.my
    adapter: my_catalogue                 # the portal's SEPARATE amendment-acts DataTables JSON
    catalogue_url: https://lom.agc.gov.my/json-amendment-2024.php
    referer: https://lom.agc.gov.my/principal.php?type=amendment&lang=BI
    verified: true
    notes: >
      The "updated" principal-acts catalogue carries DATED consolidated reprints (e.g. PDPA Act
      709 "As At 01-07-2023"), so an amendment enacted AFTER a reprint's date is NOT yet folded in
      and is absent from that catalogue (the PDPA (Amendment) Act 2024, A1727, is one such gap).
      MY publishes amendment Acts in this distinct catalogue (principal.php?type=amendment → 406
      Acts). Same record shape + adapter as the principal catalogue; matched by the same name-only
      fragments. Distinct act numbers (A1727 ≠ 709) keep amendment + principal as separate docs
      (no merge), and MY is excluded from the amendment-drop so the recent amendment survives.

# ─────────────────────────────────────────────────────────────────────────────────────────
# ROUND-2 ECONOMIES — China, India, Mongolia.
#
# The discovery QUERIES here are written in each portal's own language, because a web-search
# lane can only find what the index holds: `site:flk.npc.gov.cn "cross-border data transfer"`
# returns nothing, since no page on that portal contains that English string. They remain
# OBLIGATION phrases, never law titles — 个人信息 境内存储 describes the rule a localisation
# law imposes, exactly as "records must not be held outside" does for AU. No law name is
# hardcoded as the answer to an (economy, pillar).
#
# ⚠ ALL THREE ARE UNVERIFIED against the live sites. The websearch lane is portal-agnostic so
#   it runs, but the MY experience says how this usually ends: Google barely indexed
#   lom.agc.gov.my and we had to write an adapter against the portal's own JSON catalogue.
#   Expect the same for flk.npc.gov.cn (JS-rendered, likely geo-throttled) and legalinfo.mn.
#   Treat these entries as the lane that proves the pipeline runs end-to-end, not as finished
#   Zone 1 coverage — see docs/round2-expansion.md.

  - economy: CN
    name: State Council / Cyberspace Administration (administrative measures)
    base_url: https://www.gov.cn
    adapter: websearch
    site: gov.cn
    verified: true             # measured: PIPL 74 provisions, data-export measures 19-20 each
    queries_p6:
      - 数据出境安全评估办法
      - 个人信息出境标准合同
      - 应当在境内存储
      - 服务器 设在境内
      - 向境外提供个人信息
      # Sector sweep (blocker close-out, 2026-08-25): the panel's 6.1/6.2/6.3 citations are
      # sectoral measures whose titles carry no data vocabulary, so a concept query never
      # reaches them. Name fragments like the FLK lane's second block — one per sector RDTII
      # treats as in scope: ride-hailing, P2P lending, credit reporting, maps, publishing,
      # e-mail, population-health info.
      - 网络预约出租汽车经营服务管理暂行办法
      - 网络借贷信息中介机构业务活动管理暂行办法
      - 征信业管理条例
      - 地图管理条例
      - 网络出版服务管理规定
      - 互联网电子邮件服务管理办法
      - 人口健康信息管理办法
      - 个人信息保护法
    queries_p7:
      - 中华人民共和国网络安全法
      - 中华人民共和国数据安全法
      - 网络数据安全管理条例
      - 个人信息保护影响评估
      - 个人信息保护负责人
      - 个人信息 保存期限
      - 留存 不少于 六个月
      - 网络安全审查办法
      - 反恐怖主义法 技术支持和协助
      - 互联网信息服务管理办法
      # 6.1-ban/6.2-localisation instruments the panel cites: e-commerce law, generative-AI
      # measures; also mirror name queries so PIPL/DSL survive cac.gov.cn being unreachable.
      - 中华人民共和国电子商务法
      - 生成式人工智能服务管理暂行办法
      - 关键信息基础设施安全保护条例
    notes: >
      THE PRIMARY CHINA LANE — listed first because it is the one that actually yields statute
      text. cac.gov.cn publishes the national laws as ordinary server-rendered pages, so an
      obligation-phrase search reaches them and they extract cleanly: 中华人民共和国个人信息保护法
      (PIPL) 74 provisions, 数据出境安全评估办法 20, 个人信息出境认证办法 19, and the 2017
      个人信息和重要数据出境安全评估办法 18 — whose Article 2 is verbatim the P6-I2 local-storage
      rule. Half the panel's own China citations point here rather than at the NPC database.
      Caveat: the site also carries 答记者问 press Q&A pages about those measures. They fetch
      and split into a single block, so they are visible as noise rather than mistaken for law
      — the grader rejects them, but a tier filter would spend fewer LLM calls.

  - economy: CN
    name: National Laws and Regulations Database (NPC)
    base_url: https://flk.npc.gov.cn
    adapter: websearch
    site: flk.npc.gov.cn
    verified: partial          # discovery works; its document BODIES cannot be downloaded
    queries_p6:
      - 个人信息 境内存储
      - 向境外提供个人信息
      - 数据出境安全评估
      - 关键信息基础设施 运营者
    queries_p7:
      - 个人信息处理者 义务
      - 网络日志 留存 不少于
      - 个人信息保护负责人
      - 个人信息保护影响评估
      - 网络安全 等级保护
      - 依法要求提供 技术支持和协助
    notes: >
      DISCOVERY-ONLY, and listed SECOND on purpose. Search does reach the right national laws
      here — a query for an obligation phrase returns /detail?id=<bbbs>&title=..., and that
      title parameter decodes to the real Act name (PIPL). The bodies are the problem. The page
      is a Vite SPA; its API (/law-search/search/flfgDetails?bbbs=<id>) returns title, tier
      (flxz), promulgation and effect dates and an object-store path, but that path resolves
      through a signed OFD reader whose file host is an INTERNAL address, and the API's own
      permission block returns "download": 0. That is the operator stating the documents are
      not to be downloaded, so we do not engineer around it. What IS reachable are the
      provincial regulations mirrored on wb.flk.npc.gov.cn (/dfxfg/ PDF and WORD), which
      extract correctly but are the wrong TIER for RDTII's national indicators.

  - economy: IN
    name: India Code (Central Acts) — DSpace REST API
    base_url: https://indiacode.gov.in
    adapter: in_dspace
    site: indiacode.gov.in
    verified: true
    reachable: >-
      2026-08-22: /server/api answers 200 JSON (DSpace 7). 130,580 items; sections are
      separate items carrying their own operative text, section number, parent Act and an
      in-force flag. The HTML front end 502s on /, /browse and /sitemap.xml — the API is the
      way in, not a fallback.
    # A DOCUMENT here is a SECTION, not an Act — the publisher ships sections as separate
    # records. `discovery_max_docs` counts documents, so without this declaration India's whole
    # pillar budget was eighteen PROVISIONS where Singapore's is eighteen STATUTES, and the run
    # reported "18 documents -> 18 provisions" as though that were a normal result.
    unit: section
    # Measured 2026-08-23 against the live API. Each comment is `total corpus matches -> the
    # Central Acts whose SECTIONS matched`. Precision tracks phrase specificity almost exactly,
    # which is why these are QUOTED phrases and not the generated bag-of-words queries: the
    # unquoted form of the first line returns 71 items led by the Commercial Courts Act, the
    # National Highways Rules and the Andaman & Nicobar Police Manual.
    queries_p6:
      - '"personal data" AND "outside India"'   # 19 -> DPDP 2023 (s.16 is the 6.4 answer)
      - '"transfer of personal data"'           # 4 -> DPDP 2023 only
      - '"personal data" AND "transfer"'        # 33 -> DPDP 2023 only
      - '"data" AND "territory of India"'       # 176 -> DPDP 2023, Chemical Weapons Act
      - '"outside the territory of India"'      # 71 -> DPDP + 5 unrelated (IDF demotes them)
    queries_p7:
      - '"personal data" AND "consent"'         # 43 -> DPDP 2023, 13 sections
      - '"Data Protection Officer"'             # 7 -> DPDP 2023 (7.4)
      - '"data protection impact"'              # 4 -> DPDP 2023 (7.4)
      - '"Data Protection Board"'               # 6 -> DPDP 2023 (7.1)
      - '"reasonable security practices"'       # 17 -> IT Act 2000 s.43A (7.1)
      - '"sensitive personal data"'             # 18 -> IT Act 2000, Aadhaar Act
      - '"cyber security"'                      # 67 -> IT Act 2000, Telecommunications Act 2023
      - '"interception" AND "information"'      # 217 -> IT Act s.69, UAPA 1967 (7.5)
      - '"monitor" OR "decrypt" AND "information"'   # 33 -> IT Act 2000 (7.5)
      - '"preserve" AND "traffic data"'         # 12 -> IT Act 2000 s.67C (7.3)
      - '"retain" AND "period" AND "records"'   # 2709 -> PMLA 2002 (7.3) + 10 unrelated
    note: >-
      CORRECTION. We recorded www.indiacode.nic.in as "a JS shell". It is not: it serves a
      SITE MIGRATION notice (meta refresh to indiacode.gov.in) and its backend is gone, which
      is why every other path there returns 504. The portal moved; we misread the symptom.
      This is now the cleanest source of the nine — no PDF, no OCR, no HTML scraping and no
      article-splitting heuristic, because the publisher ships sections as separate records.
      (A second `note:` used to sit here repeating the "JS shell" claim this one corrects.
      YAML keeps the LAST duplicate key, so the file asserted the error and discarded the
      correction. Do not re-add it.)
    notes: >
      SUPERSEDED, and worth keeping because it was wrong in an expensive way: "Indian statutes
      are published in ENGLISH, so this lane needs no native query pack — the generated English
      obligation phrases apply unchanged." Sharing a language is not the same as sharing a
      QUERY MODEL. India Code's `query=` is a loose full-text match with no useful ranking, and
      the generated pack's name fragments (`companies act`, `labour act`, `income tax act`)
      exist to match a TITLE on a name-only portal. Fired at a full-text engine they matched
      any Act whose body mentions the word, and a pillar-6 run came back holding the Indian
      Reserve Forces Act 1888, the Bonded Labour System (Abolition) Act and the Medical
      Termination of Pregnancy Act. Nine of eighteen documents arrived that way, and the run
      logged no error because none occurred. See the two-stage design in adapter_india.py.

  - economy: IN
    name: India Code (legacy host, migrated away)
    base_url: https://www.indiacode.nic.in
    adapter: websearch
    verified: false
    reachable: "2026-08-22: root 200 with a migration notice; every other path 504 — dead"
    note: >-
      Kept as a documented redirect, not a lane. Delete only if the new host proves stable
      for a while; a reader who finds the old URL elsewhere should land on this explanation.
  - economy: IN
    name: MeitY (IT Rules and subordinate instruments)
    base_url: https://www.meity.gov.in
    adapter: websearch
    site: meity.gov.in
    pdf_only: true
    per_query: 10
    verified: false
    queries_p6:                # the panel's own subordinate citations, on their home portal
      - Information Technology Rules sensitive personal data
      - CERT-In Directions 2022
      - Digital Personal Data Protection Rules
    queries_p7:
      - Information Technology Rules sensitive personal data
      - Information Technology Rules interception 2009
      - CERT-In Directions 2022
      - Digital Personal Data Protection Rules
    notes: >
      Much of India's P6/P7 evidence is subordinate legislation, not Acts: the IT (Reasonable
      Security Practices) Rules 2011, the IT (Procedure and Safeguards for Interception) Rules
      2009, and the DPDP Rules. Those are gazette PDFs on meity.gov.in, absent from India Code
      — the same structural gap that MY's pdp.gov.my lane exists to close.

  - economy: IN
    name: RBI (Master Directions / circulars)
    base_url: https://www.rbi.org.in
    adapter: websearch
    site: rbi.org.in
    pdf_only: true
    per_query: 6
    verified: false
    queries_p6:                              # 6.2 storage-localisation lives in payment-system rules
      - Master Direction storage of payment system data
    queries_p7:
      - Master Direction on Information Technology Governance   # the key's 7.1/7.2
      - Master Direction Know Your Customer records             # 7.3 retention
      - Master Direction Issuance Operation Prepaid Payment Instruments
    notes: >
      The answer key's 7.3 is 19 citations long and almost all RBI/SEBI/PMLA instruments. RBI is
      the central bank — a government regulator and a trusted source by the rubric's own rule.
      Discovery-only additions; every document is still fetched, extracted and graded live.
      Its robots.txt serves a 418 error page, handled in pipeline/robots.UNREACHABLE_OVERRIDE.

  - economy: IN
    name: SEBI (regulations)
    base_url: https://www.sebi.gov.in
    adapter: websearch
    site: sebi.gov.in
    pdf_only: true
    per_query: 6
    verified: false
    queries_p7:
      - Listing Obligations Disclosure Requirements Regulations 2015
    notes: >
      SEBI's LODR Regulations 2015 (records/e-disclosure retention) are cited under 7.3.
      robots.txt readable (2026-08-25): the wildcard group is granted; only /js and /css
      are disallowed, neither of which this pipeline fetches.

  - economy: MN
    name: Unified Legal Information System (legalinfo.mn)
    base_url: https://legalinfo.mn
    adapter: mn_legalinfo
    site: legalinfo.mn
    verified: true             # measured 2026-08-22: sitemap enumerates, export returns full text
    reachable: >-
      2026-08-22, third and correct reading. This entry has been wrong twice, in opposite
      directions, and both errors are kept here because each is a different way to misread a
      portal.
      (1) "12.4k Cyrillic characters in the body, so OCR is not on the critical path" — those
      characters are the navigation menu, a registration form, the alphabet index and a list of
      industry sectors. Zero article headings. That counted Cyrillic without checking it was the
      statute, the same mistake that had India recorded as a JS shell.
      (2) "No .doc or .docx downloads, unlike China; body retrieval is unsolved" — false, and
      falsifiable in one request. The detail page's own toolbar calls
      downloadAnnexFile(this, "", lawId), which static.js resolves to
      POST /mn/downloadFile?file=&lawId=N&fDownload=1. That returns the whole instrument.
      What is true: /sitemap.xml answers 200 with 36,833 distinct lawId values; the export is
      labelled .doc but the bytes are UTF-8 HTML; and Content-Disposition carries the law's
      Mongolian title, which is the only place a title is available without running JavaScript.
    document_format: html      # the ".doc" export is Word-flavoured HTML, not a binary
    ocr_required: false        # measured — there is no image layer anywhere on this route
    # Counts are the number of TITLES in data/catalogues/MN_titles.json each term matches,
    # measured — not guessed. Anything in the hundreds is a term that will bury the statute
    # under its own implementing paperwork even with MN_MAX_PER_QUERY.
    # Counts below are DISTINCT in-force instruments after the repealed/amending filters,
    # re-measured 2026-08-27 against the fleeting-vowel matcher. The previous counts were
    # taken with the plain-substring matcher and understated every term carrying
    # мэдээлэл, because that word cannot reach its own genitive мэдээллийн by substring.
    queries_p6:
      - хүний хувийн мэдээлэл      # 1 — Personal Data Protection Law (the key's 6.1, 6.2, 6.4)
      - мэдээлэл хамгаалах         # 5
      - нийтийн мэдээлэл           # 6 — Transparency of Public Information (the key's 6.3)
      # The key's OTHER 6.3 citation is a ministerial order, not an Act: the Minister of
      # Digital Development's A/90 regulation on processing sensitive, genetic and biometric
      # data. No term above reaches it — its title leads with ЭМЗЭГ, which appears in
      # neither of the two Acts — so a pillar-6 run could not cite what the panel cites.
      - эмзэг мэдээлэл               # 2 — the A/90 sensitive-data regulation (the key's 6.3)
      # Pillar 6 is about where data may go and what must be in place before it goes. Both
      # sit in these two as well as in the data-protection Act: the Cybersecurity Law carries
      # the infrastructure duties 6.3 asks about, and the Communications Law is where a
      # localisation or facility condition on a licensed operator would be written.
      - кибер аюулгүй                # 4 — Кибер аюулгүй байдлын тухай
      - '"харилцаа холбоо" тухай'  # 21 — Communications Law. QUOTED: see _query_parts —
    # `мэдээллийн аюулгүй` (information security) is a PILLAR-7 concept and is listed only
    # there. In the pillar-6 set it pulled in a drug-safety information report and a civil
    # aviation confidentiality rule — 200-word approving resolutions that are neither about
    # cross-border data nor, in any useful sense, about data at all.
    queries_p7:
      - хүний хувийн мэдээлэл      # 2
      - мэдээлэл хамгаалах         # 3
      - кибер аюулгүй              # 6 — Кибер аюулгүй байдлын тухай (the key's 7.2)
      - мэдээллийн аюулгүй         # 10
      - нийтийн мэдээлэл           # 6
      - эмзэг мэдээлэл               # 2 — A/90 sensitive-data regulation (DPO duties, 7.4)
      - цахим гарын                # 3 — Electronic Signature Law
      - төрийн нууц                # 15 — State Secrets (7.5)
      - архивын                    # 43 — Law on Archives (retention, 7.3)
      - '"харилцаа холбоо" тухай'  # 21 — Communications Law (the key's 7.3, sectoral).
      # QUOTED so холбоо must sit next to харилцаа: unquoted it also means "federation",
      # and Mongolia has one treaty Act per recognised state ("… Холбооны Улстай дипломат
      # харилцаа тогтоох тухай"), each of which matched all three words as a principal Act.
      - банкны тухай               # 84 — Banking Law (the key's 7.5); the broadest term here
    note: >-
      Discovery is the sitemap; titles come from data/catalogues/MN_titles.json, built once by
      tools/build_mn_catalogue.py because legalinfo.mn's listing pages render their rows in the
      browser and no server-rendered index carries a title. That file is a TABLE OF CONTENTS —
      id, title, byte size — with no provision text, no indicator and no mapping; bodies are
      fetched live on every run. Same arrangement Malaysia already uses.
      REMOVED, and the reason is worth keeping: `хилийн чанад` was in the pillar-6 set as
      "abroad". It matches 21 titles and every one of them is a customs regulation about
      processing GOODS abroad — "Барааг хилийн чанадад боловсруулах журам". A pillar-6 run
      returned seventeen documents of which twelve were those. The word `хилийн` does not
      appear even once in Mongolia's Personal Data Protection Law; its article 14 says
      `гадаад улс дахь` ("in a foreign state"). A term chosen from a dictionary rather than
      from the statute, and it cost the run its whole document set.

      Queries are Mongolian STEMS, not inflected forms: the language is agglutinative and each
      WORD of a query is matched as a substring of the title, so the stem "мэдээлэл" reaches
      "мэдээллийн" while the inflected "мэдээллийг" would reach nothing. Word-by-word rather
      than whole-phrase for two measured reasons: the Personal Data Protection Law is titled
      "ХҮНИЙ ХУВИЙН МЭДЭЭЛЭЛ …", not "ХУВЬ ХҮНИЙ …" (a phrase written from the English name
      misses it), and the portal's own filename for it omits a space —
      "МЭДЭЭЛЭЛХАМГААЛАХ" — which no phrase test survives.
      Check them with tools/audit_native_terms.py --economy MN.
  - economy: TH
    name: Office of the Council of State (Thai law library)
    base_url: https://www.krisdika.go.th
    adapter: websearch
    verified: false
    reachable: "2026-08-21: TLS fixed (self-signed cert, see fetch._TLS_RELAXED_HOSTS); handshake now succeeds but /, /th/ and /web/guest/law all 404 — the document path is still unknown"
    note: >-
      Thai statutes are published as PDF, frequently scanned. The English translations on the
      same site are unofficial, so the AUTHORITATIVE text is Thai — which is what the Verbatim
      Snippet column has to carry, and what Language of Source has to say.
  - economy: TH
    name: Royal Thai Government Gazette
    base_url: https://ratchakitcha.soc.go.th
    adapter: websearch
    verified: false
    reachable: "2026-08-21: 403 to BOTH plain urllib and the browser lane — genuinely WAF-blocked, unlike vbpl.vn and bpk.go.id which the browser lane cleared"
    note: The gazette of record; scanned PDFs dominate, so this is the OCR-heavy lane.
  - economy: VN
    name: National Legal Normative Document Database (Ministry of Justice)
    base_url: https://vbpl.vn
    adapter: websearch
    verified: false
    reachable: "2026-08-21: plain urllib 403 (WAF); browser lane HTTP 200 — reachable through scrapling, which is the default fetcher"
    note: >-
      Viet Nam publishes consolidated text as HTML and .doc. The .doc lane already works
      (ocr._word_to_text), which matters because Vietnamese OCR is the weakest link — no local
      recognition model carries the precomposed tone forms.
  - economy: ID
    name: Database Peraturan JDIH BPK
    base_url: https://peraturan.bpk.go.id
    adapter: websearch
    verified: false
    robots_read: "2026-08-21"
    reachable: "2026-08-21: plain urllib 403 (WAF); browser lane HTTP 200 — reachable through scrapling, which is the default fetcher"
    note: >-
      READ THE ROBOTS FILE BEFORE CHANGING THIS. It disallows nine NAMED agents — ClaudeBot,
      GPTBot, CCBot, Bytespider, Amazonbot, Applebot-Extended, Google-Extended,
      meta-externalagent, CloudflareBrowserRenderingCrawler — and grants the wildcard group
      "Allow: /" with "Content-Signal: search=yes, ai-train=no, use=reference".
      We had this host recorded as simply disallowed. That was too broad: the block names
      Anthropic's WEB CRAWLER, which is not this pipeline. VeriTrade fetches as
      VeriTrade-Research/0.2 (config.crawl_user_agent) and falls in the wildcard group, whose
      signals it satisfies exactly — it references and cites provisions with their source URL,
      and it trains no model on them. So the host is permitted to US and forbidden to a
      general-purpose AI crawler, and the difference is the user agent we send. Two rules
      follow and neither is optional: never fetch this host with an agent identifying as one of
      the named crawlers, and never use its text for training.
  - economy: ID
    name: JDIH Nasional (aggregator)
    base_url: https://jdihn.go.id
    adapter: websearch
    verified: false
    reachable: "2026-08-21: no response in 20s — host did not resolve; may be the wrong name"
    note: >-
      Kept as the second Indonesian lane, but unproven: it did not answer at all. Since the BPK
      host turns out to be permitted to us, this is a redundancy rather than the primary route.
  - economy: KZ
    name: Adilet — Legal Information System of Kazakhstan
    base_url: https://adilet.zan.kz
    adapter: websearch
    verified: false
    reachable: "2026-08-21: HTTP 200, 13.9k chars of server-rendered text, 18s"
    robots_read: "2026-08-21"
    note: >-
      Reachable and NOT a JS shell — the only one of the six that answered plain HTTP first try.
      robots.txt disallows the listing and search paths (/kaz|rus|eng/search/, /list/docs/,
      /archive/, /origins/), so discovery must NOT enumerate through them; individual document
      URLs are permitted. Serves Kazakh AND Russian editions of the same act under /kaz/ and
      /rus/, and the Latin-alphabet transition means Kazakh itself appears in two orthographies.
      Script detection must therefore run per document, never per economy.
  - economy: LA
    name: Lao Official Gazette
    base_url: https://laoofficialgazette.gov.la
    adapter: websearch
    verified: false
    reachable: "2026-08-21: URLError — host does not resolve; the Lao gazette URL still needs finding"
    note: >-
      Weakest coverage of the nine on every axis: scanned PDFs, no maintained Lao OCR model,
      and legacy Lao fonts that map letters into upper-ASCII so even a text layer can be
      mojibake. script_validity() is the only defence and it is advisory.
  - economy: RU
    name: Official Internet Portal of Legal Information
    base_url: http://publication.pravo.gov.ru
    adapter: websearch
    verified: false
    reachable: "2026-08-21: HTTP 200, 10.4k chars, 0.8s, no geo-block observed"
    robots_read: "2026-08-21"
    sitemap: http://publication.pravo.gov.ru/sitemap.xml
    note: >-
      Answered immediately, no geo-block. But robots.txt disallows /Search AND /File, and /File
      is where the document bodies live — so the obvious route is the forbidden one. It offers a
      sitemap instead, which is both permitted and a better discovery surface than search.
      Build the RU lane on the sitemap. paddle lang "ru" reads the script (verified against the
      model dictionary), so OCR is not the risk here; the access route is.

regulators:
  SG:
    - host: www.pdpc.gov.sg          # Personal Data Protection Commission
      remit: data_protection
      strategies: [sitemap, crawl, search]
    - host: www.imda.gov.sg          # Info-communications Media Development Authority
      remit: sectoral                # licences + telecom terms & conditions
      # crawl is required here: the licence conditions and service terms live under
      # /-/media/Imda/Files/... which the sitemap does not list.
      strategies: [sitemap, crawl, search]
      crawl_pages: 150
  AU:
    - host: www.oaic.gov.au          # Office of the Australian Information Commissioner
      remit: data_protection
      strategies: [sitemap, crawl, search]   # answers 403 to non-browser robots/sitemap fetches
    - host: www.homeaffairs.gov.au   # cyber security strategy
      remit: sectoral
      strategies: [search, crawl]
      crawl_pages: 80                # the strategy is an HTML page several levels down
  MY:
    - host: www.pdp.gov.my           # Jabatan Perlindungan Data Peribadi
      base: https://www.pdp.gov.my/ppdpv1
      remit: data_protection
      strategies: [wp_media, crawl, search]
