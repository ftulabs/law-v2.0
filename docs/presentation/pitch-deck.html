document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"c4c50b54-70a7-47aa-93b3-e3d7ed8f3952\"><\u002Fscript>\n\n\n\n\n\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <style>\n    html, body { margin: 0; padding: 0; background: #FFFFFF; scroll-behavior: smooth; }\n    a { color: #2F7FE6; text-decoration: none; }\n    a:hover { color: #16324F; text-decoration: underline; }\n    @media (prefers-reduced-motion: reduce) { html, body { scroll-behavior: auto; } }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family:Arial, Helvetica, sans-serif;color:#16324F;background:#FFFFFF\" data-screen-label=\"VeriTrade Interactive\">\n\n  <!-- NAV -->\n  <div style=\"position:sticky;top:0;z-index:50;background:#FFFFFF;border-bottom:1px solid rgba(22,50,79,0.12);display:flex;align-items:center;justify-content:space-between;padding:14px 48px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;min-width:0;overflow:hidden;margin-right:24px\">\n      <div style=\"font-size:24px;font-weight:bold;color:#2F7FE6;flex:none\"><span>VeriTrade<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:14px;color:#4A6076;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\"><span>UN Global Hackathon on AI for Digital Trade Regulatory Analysis<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:26px;font-size:15px;white-space:nowrap;flex:none\">\n      <a href=\"#problem\" style=\"color:#16324F\">Problem<\u002Fa>\n      <a href=\"#pipeline\" style=\"color:#16324F\">How it works<\u002Fa>\n      <a href=\"#trust\" style=\"color:#16324F\">Trust &amp; evidence<\u002Fa>\n      <a href=\"#results\" style=\"color:#16324F\">Results<\u002Fa>\n      <a href=\"#demo\" style=\"color:#16324F\">Demo<\u002Fa>\n      <a href=\"#scale\" style=\"color:#16324F\">Scale<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- HERO -->\n  <div style=\"background:linear-gradient(180deg, #EEF4FC 0%, #FFFFFF 100%);padding:80px 48px 64px\">\n    <div style=\"max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:22px\">\n      <h1 style=\"margin:0;font-size:56px;font-weight:bold;letter-spacing:-0.01em;line-height:1.1;max-width:900px\"><span>Find the law, prove the clause, automatically.<\u002Fspan><\u002Fh1>\n      <p style=\"margin:0;font-size:21px;line-height:1.5;color:#4A6076;max-width:760px\"><span>Give VeriTrade an economy and a regulatory pillar. It discovers the laws on official portals, reads them (even scanned PDFs), and maps every provision to the exact RDTII indicator with a verbatim citation.<\u002Fspan><\u002Fp>\n      <div style=\"display:flex;gap:40px;flex-wrap:wrap;margin-top:18px\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <div style=\"font-size:40px;font-weight:bold;color:#2F7FE6\"><span>3<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:15px;color:#4A6076\"><span>economies covered<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <div style=\"font-size:40px;font-weight:bold;color:#2F7FE6\"><span>9/9<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:15px;color:#4A6076\"><span>indicators populated<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <div style=\"font-size:40px;font-weight:bold;color:#2F7FE6\"><span>1.11%<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:15px;color:#4A6076\"><span>OCR error rate (bar: 5%)<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <div style=\"font-size:40px;font-weight:bold;color:#2F7FE6\"><span>~$0.07<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:15px;color:#4A6076\"><span>LLM cost per economy<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <div style=\"font-size:40px;font-weight:bold;color:#2F7FE6\"><span>$0.00<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:15px;color:#4A6076\"><span>on an open-weight stack<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- PROBLEM -->\n  <div id=\"problem\" style=\"padding:72px 48px;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:32px\">\n    <h2 style=\"margin:0;font-size:36px;font-weight:bold\"><span>Why this is hard to do by hand<\u002Fspan><\u002Fh2>\n    <p style=\"margin:0;font-size:18px;line-height:1.55;color:#4A6076;max-width:760px\"><span>For every economy and indicator, a researcher must find the right statute, read the operative clause, interpret it, and cite it precisely. Manual work does not scale to 40+ economies on a regular refresh.<\u002Fspan><\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(3, 1fr);gap:20px\">\n      <div style=\"border:1px solid rgba(22,50,79,0.14);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:8px;transition:box-shadow 0.15s ease\" style-hover=\"box-shadow:0 6px 18px rgba(22,50,79,0.12)\">\n        <div style=\"font-size:18px;font-weight:bold\"><span>Scattered and unindexed<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.5;color:#4A6076\"><span>Every economy has its own portal and search. No common API.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid rgba(22,50,79,0.14);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:8px;transition:box-shadow 0.15s ease\" style-hover=\"box-shadow:0 6px 18px rgba(22,50,79,0.12)\">\n        <div style=\"font-size:18px;font-weight:bold\"><span>Bot-protected<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.5;color:#4A6076\"><span>Firewalls and TLS fingerprinting block naive crawlers with HTTP 403.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid rgba(22,50,79,0.14);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:8px;transition:box-shadow 0.15s ease\" style-hover=\"box-shadow:0 6px 18px rgba(22,50,79,0.12)\">\n        <div style=\"font-size:18px;font-weight:bold\"><span>Mixed formats<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.5;color:#4A6076\"><span>HTML, text PDFs, and scanned image-only PDFs side by side.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid rgba(22,50,79,0.14);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:8px;transition:box-shadow 0.15s ease\" style-hover=\"box-shadow:0 6px 18px rgba(22,50,79,0.12)\">\n        <div style=\"font-size:18px;font-weight:bold\"><span>Multilingual<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.5;color:#4A6076\"><span>Malaysia publishes bilingually; the finals add Thai, Chinese, Russian and Lao.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid rgba(22,50,79,0.14);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:8px;transition:box-shadow 0.15s ease\" style-hover=\"box-shadow:0 6px 18px rgba(22,50,79,0.12)\">\n        <div style=\"font-size:18px;font-weight:bold\"><span>Buried across many acts<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.5;color:#4A6076\"><span>One indicator can live in criminal-procedure, telecom and security laws at once.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid rgba(22,50,79,0.14);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:8px;transition:box-shadow 0.15s ease\" style-hover=\"box-shadow:0 6px 18px rgba(22,50,79,0.12)\">\n        <div style=\"font-size:18px;font-weight:bold\"><span>Verification burden<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.5;color:#4A6076\"><span>A citation is only trustworthy if the quote truly appears in the official source.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- PIPELINE EXPLORER -->\n  <div id=\"pipeline\" style=\"background:#F5F9FE;padding:72px 48px\">\n    <div style=\"max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:32px\">\n      <h2 style=\"margin:0;font-size:36px;font-weight:bold\"><span>How it works, stage by stage<\u002Fspan><\u002Fh2>\n      <p style=\"margin:0;font-size:18px;color:#4A6076\"><span>Click a stage to see what happens inside it.<\u002Fspan><\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(5, 1fr);gap:14px\">\n        <button sc-camel-on-click=\"{{ selectStage0 }}\" style=\"cursor:pointer;font-family:inherit;text-align:left;border-radius:12px;padding:18px 18px;border:2px solid {{ stage0Border }};background:{{ stage0Bg }};color:{{ stage0Color }};display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-size:14px;font-weight:bold;opacity:0.7\">1<\u002Fspan>\n          <span style=\"font-size:19px;font-weight:bold\">Discover<\u002Fspan>\n        <\u002Fbutton>\n        <button sc-camel-on-click=\"{{ selectStage1 }}\" style=\"cursor:pointer;font-family:inherit;text-align:left;border-radius:12px;padding:18px 18px;border:2px solid {{ stage1Border }};background:{{ stage1Bg }};color:{{ stage1Color }};display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-size:14px;font-weight:bold;opacity:0.7\">2<\u002Fspan>\n          <span style=\"font-size:19px;font-weight:bold\">Fetch<\u002Fspan>\n        <\u002Fbutton>\n        <button sc-camel-on-click=\"{{ selectStage2 }}\" style=\"cursor:pointer;font-family:inherit;text-align:left;border-radius:12px;padding:18px 18px;border:2px solid {{ stage2Border }};background:{{ stage2Bg }};color:{{ stage2Color }};display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-size:14px;font-weight:bold;opacity:0.7\">3<\u002Fspan>\n          <span style=\"font-size:19px;font-weight:bold\">Extract<\u002Fspan>\n        <\u002Fbutton>\n        <button sc-camel-on-click=\"{{ selectStage3 }}\" style=\"cursor:pointer;font-family:inherit;text-align:left;border-radius:12px;padding:18px 18px;border:2px solid {{ stage3Border }};background:{{ stage3Bg }};color:{{ stage3Color }};display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-size:14px;font-weight:bold;opacity:0.7\">4<\u002Fspan>\n          <span style=\"font-size:19px;font-weight:bold\">Map<\u002Fspan>\n        <\u002Fbutton>\n        <button sc-camel-on-click=\"{{ selectStage4 }}\" style=\"cursor:pointer;font-family:inherit;text-align:left;border-radius:12px;padding:18px 18px;border:2px solid {{ stage4Border }};background:{{ stage4Bg }};color:{{ stage4Color }};display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-size:14px;font-weight:bold;opacity:0.7\">5<\u002Fspan>\n          <span style=\"font-size:19px;font-weight:bold\">Verify &amp; deliver<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;border:1px solid rgba(22,50,79,0.14);border-radius:14px;padding:32px 36px;min-height:220px\">\n        <sc-if value=\"{{ stageIs0 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <div style=\"font-size:22px;font-weight:bold\"><span>Discover: no seed URLs, no hardcoded law names<\u002Fspan><\u002Fdiv>\n            <ul style=\"margin:0;padding-left:24px;display:flex;flex-direction:column;gap:8px;font-size:17px;line-height:1.5;color:#4A6076\">\n              <li><span>Queries are derived from the indicators themselves: concept phrases, never a specific law title. That is why it generalises to any economy.<\u002Fspan><\u002Fli>\n              <li><span>Singapore: portal-scoped web search. Australia: the official OData API plus a full-text \"obligation phrase\" lane. Malaysia: the portal's own acts catalogue.<\u002Fspan><\u002Fli>\n              <li><span>Repealed acts, bills and non-law hits are dropped; Australian hits are verified in-force against the official register.<\u002Fspan><\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ stageIs1 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <div style=\"font-size:22px;font-weight:bold\"><span>Fetch: bot-resistant, polite, cached<\u002Fspan><\u002Fdiv>\n            <ul style=\"margin:0;padding-left:24px;display:flex;flex-direction:column;gap:8px;font-size:17px;line-height:1.5;color:#4A6076\">\n              <li><span>Scrapling downloads with a real-browser TLS fingerprint, which clears firewalls that 403 plain crawlers; httpx is the fallback.<\u002Fspan><\u002Fli>\n              <li><span>Per-host delays keep the crawl polite; a content-addressed cache deduplicates identical files.<\u002Fspan><\u002Fli>\n              <li><span>Landing pages that embed a PDF viewer are resolved to the actual PDF.<\u002Fspan><\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ stageIs2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <div style=\"font-size:22px;font-weight:bold\"><span>Extract: real OCR, verbatim article chunks<\u002Fspan><\u002Fdiv>\n            <ul style=\"margin:0;padding-left:24px;display:flex;flex-direction:column;gap:8px;font-size:17px;line-height:1.5;color:#4A6076\">\n              <li><span>Text-layer PDFs are read by MarkItDown; scanned image-only PDFs go through RapidOCR/PaddleOCR with a measured 1.11% character error rate (the bar is 5%).<\u002Fspan><\u002Fli>\n              <li><span>Country-specific structural parsing splits each law into article/section chunks: one provision, one chunk, exact source text preserved.<\u002Fspan><\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ stageIs3 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <div style=\"font-size:22px;font-weight:bold\"><span>Map: LLM legal reasoning that sees the siblings<\u002Fspan><\u002Fdiv>\n            <ul style=\"margin:0;padding-left:24px;display:flex;flex-direction:column;gap:8px;font-size:17px;line-height:1.5;color:#4A6076\">\n              <li><span>Hybrid retrieval shortlists candidates: BM25 keyword recall plus multilingual embeddings, reranked by a cross-encoder. For small corpora every provision is graded, so retrieval is a signal, not a gate.<\u002Fspan><\u002Fli>\n              <li><span>The model grades one (provision, indicator) pair at a time and is shown every sibling indicator's legal test, so it distinguishes look-alikes such as a transfer ban versus a conditional flow.<\u002Fspan><\u002Fli>\n              <li><span>Unsure means reject: a conservative default prevents confident-but-wrong mappings.<\u002Fspan><\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ stageIs4 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <div style=\"font-size:22px;font-weight:bold\"><span>Verify and deliver: evidence you can check<\u002Fspan><\u002Fdiv>\n            <ul style=\"margin:0;padding-left:24px;display:flex;flex-direction:column;gap:8px;font-size:17px;line-height:1.5;color:#4A6076\">\n              <li><span>The snippet is copied from the fetched source, never written by the LLM; a grounding check confirms it occurs in the document.<\u002Fspan><\u002Fli>\n              <li><span>Every row carries a source URL, an article citation and a 4-signal confidence score; low-confidence rows go to human review.<\u002Fspan><\u002Fli>\n              <li><span>Output is the official 13-column CSV plus a machine-auditable JSON, consolidated into one master submission sheet.<\u002Fspan><\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- TRUST: CONFIDENCE DEMO + EXAMPLE -->\n  <div id=\"trust\" style=\"padding:72px 48px;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:40px\">\n    <h2 style=\"margin:0;font-size:36px;font-weight:bold\"><span>Trust is built in, not bolted on<\u002Fspan><\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <div style=\"font-size:21px;font-weight:bold\"><span>Try the confidence router<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0;font-size:17px;line-height:1.5;color:#4A6076\"><span>Every mapping gets a score from four signals: search match, legal fit, quote grounding and scope fit. Drag the slider to see where a row would go.<\u002Fspan><\u002Fp>\n        <input type=\"range\" min=\"0\" max=\"1\" step=\"0.01\" value=\"{{ conf }}\" sc-camel-on-input=\"{{ onConf }}\" style=\"width:100%;accent-color:#2F7FE6;height:34px;cursor:pointer\">\n        <div style=\"display:flex;align-items:center;gap:18px\">\n          <div style=\"font-size:44px;font-weight:bold;color:{{ confColor }};min-width:120px\">{{ confLabel }}<\u002Fdiv>\n          <div style=\"border-radius:999px;padding:8px 20px;font-size:16px;font-weight:bold;background:{{ confBg }};color:{{ confColor }}\">{{ confZone }}<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:16px;line-height:1.5;color:#4A6076\">{{ confExplain }}<\u002Fp>\n        <div style=\"display:flex;gap:10px;font-size:14px;color:#4A6076\">\n          <div style=\"flex:1;border-top:6px solid #C94F4F;padding-top:6px\"><span>&lt; 0.60 set aside<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:1;border-top:6px solid #D89B2C;padding-top:6px\"><span>0.60 to 0.85 review<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:1;border-top:6px solid #2E9E63;padding-top:6px\"><span>0.85+ auto-accept<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#EEF4FC;border-radius:14px;padding:30px 32px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font-size:21px;font-weight:bold\"><span>A real row from Singapore, Pillar 6<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#FFFFFF;border-radius:10px;padding:20px 22px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-size:16px\"><strong>Personal Data Protection Act 2012, Section 26<\u002Fstrong><\u002Fdiv>\n          <div style=\"font-size:16px;font-style:italic;line-height:1.5;color:#4A6076;border-left:3px solid #2F7FE6;padding-left:14px\"><span>\"An organisation shall not transfer any personal data to a country or territory outside Singapore except in accordance with requirements prescribed under this Act...\"<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.5;color:#4A6076\"><span>Mapped to <\u002Fspan><strong>P6-I4 (conditional cross-border flow)<\u002Fstrong><span>, not P6-I1 (a ban): transfer is conditionally allowed. The sibling-aware prompt makes exactly this distinction, the most common human-mapping confusion.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:14px;font-size:14px;color:#4A6076;flex-wrap:wrap\">\n            <span>Confidence 0.82, routed to review<\u002Fspan>\n            <a href=\"https://sso.agc.gov.sg/Act/PDPA2012\" target=\"_blank\" rel=\"noopener\">sso.agc.gov.sg/Act/PDPA2012<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.5;color:#4A6076\"><span>Five guarantees stop hallucinated citations: the snippet is copied, grounded, topically guarded, linked to the official source, and scored for routing.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- RESULTS -->\n  <div id=\"results\" style=\"background:#F5F9FE;padding:72px 48px\">\n    <div style=\"max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:28px\">\n      <h2 style=\"margin:0;font-size:36px;font-weight:bold\"><span>Measured, not claimed<\u002Fspan><\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n        <div style=\"background:#FFFFFF;border-radius:12px;padding:26px 28px;display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font-size:34px;font-weight:bold;color:#2F7FE6\"><span>1.11%<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:17px;font-weight:bold\"><span>OCR character error rate<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.5;color:#4A6076\"><span>Edit distance against a ground-truth sidecar on the bundled scanned gazette. The pass bar is 5%.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF;border-radius:12px;padding:26px 28px;display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font-size:34px;font-weight:bold;color:#2F7FE6\"><span>100%<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:17px;font-weight:bold\"><span>Citation fidelity<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.5;color:#4A6076\"><span>Verbatim by construction: the snippet must occur in the fetched source or the row is rejected.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF;border-radius:12px;padding:26px 28px;display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font-size:34px;font-weight:bold;color:#2F7FE6\"><span>14 laws, 0 junk<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:17px;font-weight:bold\"><span>Discovery precision (Australia, Pillar 6)<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.5;color:#4A6076\"><span>Every surfaced law in-force and on-topic after the official-register filter.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF;border-radius:12px;padding:26px 28px;display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font-size:34px;font-weight:bold;color:#2F7FE6\"><span>9/9<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:17px;font-weight:bold\"><span>Coverage, always<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.5;color:#4A6076\"><span>Every indicator gets a row or an explicit \"no evidence\" placeholder. Nothing is silently blank.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;border-radius:12px;padding:22px 28px;font-size:16px;line-height:1.5;color:#4A6076\"><strong style=\"color:#16324F\">Transparency note:<\u002Fstrong><span> the LLM grader is stochastic, so borderline definitional clauses can flip between runs. The review queue is the safety net, and a chosen run is frozen via the result cache for a reproducible submission.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- DEMO GALLERY -->\n  <div id=\"demo\" style=\"padding:72px 48px;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:28px\">\n    <h2 style=\"margin:0;font-size:36px;font-weight:bold\"><span>The product, as judges see it<\u002Fspan><\u002Fh2>\n    <p style=\"margin:0;font-size:18px;color:#4A6076\"><span>Click any screenshot to enlarge.<\u002Fspan><\u002Fp>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px\">\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <img src=\"85e38224-e504-490c-9824-5283f40cc036\" alt=\"VeriTrade dashboard\" sc-camel-on-click=\"{{ openShot0 }}\" style=\"width:100%;border-radius:12px;border:1px solid rgba(22,50,79,0.14);cursor:zoom-in;display:block\">\n        <div style=\"font-size:15px;color:#4A6076\"><span>Run setup: pick a country and pillar, press Run analysis. Smart defaults, no setup.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <img src=\"dbf26e2c-4fba-46c6-8ef6-7a2a7fb9bcea\" alt=\"Results dossier\" sc-camel-on-click=\"{{ openShot1 }}\" style=\"width:100%;border-radius:12px;border:1px solid rgba(22,50,79,0.14);cursor:zoom-in;display:block\">\n        <div style=\"font-size:15px;color:#4A6076\"><span>Results dossier: mapped laws with verbatim snippet, confidence traffic-light and source link.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <img src=\"6ebbec34-0d73-49dd-b19a-85de567063c2\" alt=\"Human review queue\" sc-camel-on-click=\"{{ openShot2 }}\" style=\"width:100%;border-radius:12px;border:1px solid rgba(22,50,79,0.14);cursor:zoom-in;display:block\">\n        <div style=\"font-size:15px;color:#4A6076\"><span>Human review: borderline rows get Approve, Reject or Fix indicator; notes go to the audit log.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <img src=\"a56e158a-c03d-47f0-90b4-8c9d4d4c46e4\" alt=\"Download tab with submission CSV\" sc-camel-on-click=\"{{ openShot3 }}\" style=\"width:100%;border-radius:12px;border:1px solid rgba(22,50,79,0.14);cursor:zoom-in;display:block\">\n        <div style=\"font-size:15px;color:#4A6076\"><span>Output: the official 13-column submission CSV plus the evidence JSON for technical validators.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ lightboxOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div sc-camel-on-click=\"{{ closeShot }}\" style=\"position:fixed;inset:0;z-index:100;background:rgba(10,20,30,0.85);display:flex;align-items:center;justify-content:center;padding:40px;cursor:zoom-out\">\n        <img src=\"{{ lightboxSrc }}\" alt=\"Enlarged screenshot\" style=\"max-width:100%;max-height:100%;border-radius:10px\">\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <!-- SCALE -->\n  <div id=\"scale\" style=\"background:#16324F;color:#FFFFFF;padding:72px 48px\">\n    <div style=\"max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:32px\">\n      <h2 style=\"margin:0;font-size:36px;font-weight:bold;color:#FFFFFF\"><span>Scaling is configuration, not engineering<\u002Fspan><\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(4, 1fr);gap:24px\">\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font-size:19px;font-weight:bold;color:#B3C6E7\"><span>More economies<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:16px;line-height:1.5;color:rgba(255,255,255,0.85)\"><span>Add one portal domain. The finals targets plug in the same way.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font-size:19px;font-weight:bold;color:#B3C6E7\"><span>More languages<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:16px;line-height:1.5;color:rgba(255,255,255,0.85)\"><span>Embeddings are already multilingual; swap in a multilingual reranker and a translation cross-check.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font-size:19px;font-weight:bold;color:#B3C6E7\"><span>More domains<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:16px;line-height:1.5;color:rgba(255,255,255,0.85)\"><span>Indicators are data-driven; add other RDTII pillars with zero pipeline changes.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font-size:19px;font-weight:bold;color:#B3C6E7\"><span>Live monitoring<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:16px;line-height:1.5;color:rgba(255,255,255,0.85)\"><span>Scheduled re-crawls diff against cache to flag amended or new laws automatically.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(255,255,255,0.2);padding-top:28px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;font-size:15px;color:rgba(255,255,255,0.75)\">\n        <div><span>VeriTrade, Foreign Trade University (FTU), Vietnam. Contact: minhtc@ftu.edu.vn<\u002Fspan><\u002Fdiv>\n        <div><span>Open source, Apache-2.0. LLM and OCR swappable via one config value.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 1440, &quot;height&quot;: 900}}\">\nclass Component extends DCLogic {\n  state = { stage: 0, conf: 0.82, lightbox: null };\n\n  renderVals() {\n    const s = this.state.stage;\n    const mk = (i) => () => this.setState({ stage: i });\n    const stageVals = {};\n    for (let i = 0; i < 5; i++) {\n      const active = s === i;\n      stageVals['stage' + i + 'Border'] = active ? '#2F7FE6' : 'rgba(22,50,79,0.18)';\n      stageVals['stage' + i + 'Bg'] = active ? '#2F7FE6' : '#FFFFFF';\n      stageVals['stage' + i + 'Color'] = active ? '#FFFFFF' : '#16324F';\n      stageVals['stageIs' + i] = active;\n      stageVals['selectStage' + i] = mk(i);\n    }\n\n    const c = this.state.conf;\n    let confZone, confColor, confBg, confExplain;\n    if (c >= 0.85) {\n      confZone = 'Auto-accept';\n      confColor = '#2E9E63';\n      confBg = '#E3F3E8';\n      confExplain = 'High confidence: the row goes straight into the submission set. No human time spent.';\n    } else if (c >= 0.6) {\n      confZone = 'Human review';\n      confColor = '#B27713';\n      confBg = '#FBF0DC';\n      confExplain = 'Borderline: the row appears in the review queue with Approve, Reject and Fix-indicator actions. Notes are saved to the audit log.';\n    } else {\n      confZone = 'Set aside';\n      confColor = '#C94F4F';\n      confBg = '#F9E3E3';\n      confExplain = 'Low confidence: the row is quarantined and never enters the submission set unless a human explicitly rescues it.';\n    }\n\n    const R = window.__resources || {};\n    const shots = [\n      R.shotDashboard || 'assets/demo-dashboard.png',\n      R.shotResults || 'assets/demo-results-list.png',\n      R.shotReview || 'assets/demo-review.png',\n      R.shotOutput || 'assets/demo-output.png'\n    ];\n    const shotVals = {};\n    shots.forEach((src, i) => {\n      shotVals['openShot' + i] = () => this.setState({ lightbox: src });\n    });\n\n    return {\n      ...stageVals,\n      ...shotVals,\n      conf: c,\n      confLabel: c.toFixed(2),\n      confZone, confColor, confBg, confExplain,\n      onConf: (e) => this.setState({ conf: parseFloat(e.target.value) }),\n      lightboxOpen: this.state.lightbox !== null,\n      lightboxSrc: this.state.lightbox || '',\n      closeShot: () => this.setState({ lightbox: null })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
