[package]
name = "veritrade"
version = "0.1.0"
description = "VeriTrade — auditable legal evidence extraction"
authors = ["Team VeriTrade"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri v2 builds mobile from a library target; the binary is desktop-only.
# Without this, `tauri ios build` and `tauri android build` have nothing to link.
name = "veritrade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
